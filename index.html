function editarUsuario(i){
  S.modal={type:'editUsuario',idx:i,data:{...S.usuarios[i]}};
  render();
}

function eliminarUsuario(i){
  if(S.usuarios[i].id===S._usuarioActual?.id){alert('No puedes eliminar tu propio usuario.');return;}
  if(!confirm(`¿Eliminar usuario "${S.usuarios[i].usuario}"?`)) return;
  S.usuarios.splice(i,1);
  saveState(); render();
}

function guardarUsuario(){
  const d=S.modal.data;
  if(!d.usuario?.trim()||!d.password?.trim()){alert('Usuario y contraseña son obligatorios.');return;}
  if(S.modal.type==='nuevoUsuario'){
    if(S.usuarios.find(u=>u.usuario===d.usuario.trim())){alert('Ese usuario ya existe.');return;}
    d.id=Date.now();
    S.usuarios.push({...d,usuario:d.usuario.trim()});
  } else {
    S.usuarios[S.modal.idx]={...d,usuario:d.usuario.trim()};
  }
  S.modal=null; saveState(); render();
}


// ===================== IMPORTAR UNIDADES DESDE EXCEL =====================
async function importarUnidadesExcel(input){
  const file = input.files[0];
  if(!file) return;
  if(!window.XLSX){ alert('Librería Excel no disponible. Recarga la página.'); return; }

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb  = XLSX.read(e.target.result, { type: 'binary' });
      const ws  = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      // Detectar fila de headers (buscar "PLACA" en las primeras 10 filas)
      let headerRow = -1;
      for(let i = 0; i < Math.min(10, rows.length); i++){
        const row = rows[i].map(v => String(v).toUpperCase().trim());
        if(row.includes('PLACA') && row.includes('TARJETA')){ headerRow = i; break; }
      }
      if(headerRow < 0){ alert('No se encontró la fila de encabezados.\nAsegúrate de que el Excel tenga columnas PLACA y TARJETA.'); return; }

      const headers = rows[headerRow].map(v => String(v).toUpperCase().trim());
      const col = (name) => headers.indexOf(name);

      // Parsear filas de datos
      const nuevas = [];
      for(let i = headerRow + 1; i < rows.length; i++){
        const r = rows[i];
        const placa = String(r[col('PLACA')]||'').trim();
        if(!placa) continue;
        nuevas.push({
          placa,
          tarjeta:        String(r[col('TARJETA')]||'').trim(),
          estatus:        String(r[col('ESTATUS')]||'ACTIVA').trim() || 'ACTIVA',
          combustible:    String(r[col('COMBUSTIBLE')]||'Magna').trim() || 'Magna',
          tanque:         parseFloat(r[col('TANQUE')])||0,
          saldo:          parseFloat(r[col('SALDO')])||0,
          tipoCarga:      String(r[col('TIPO CARGA')]||r[col('TIPOCARGA')]||'OPCIONAL').trim() || 'OPCIONAL',
          idInicial:      parseInt(r[col('ID INICIAL')]||r[col('IDINICIAL')])||52,
          odometroActual: parseInt(r[col('ODOMETRO ACTUAL')]||r[col('ODOMETROACTUAL')])||0,
          aumMinOdo:      parseInt(r[col('AUM MIN ODO')]||r[col('AUMMINODO')])||0,
          aumMaxOdo:      parseInt(r[col('AUM MAX ODO')]||r[col('AUMMAXODO')])||0,
          observaciones:  String(r[col('OBSERVACIONES')]||'').trim(),
          tipoVehiculo:   String(r[col('TIPO VEHICULO')]||r[col('TIPOVEHICULO')]||'CAMIONETA').trim() || 'CAMIONETA',
          vehiculo:       String(r[col('VEHICULO')]||'').trim(),
          marca:          String(r[col('MARCA')]||'').trim(),
          modelo:         parseInt(r[col('MODELO')])||0,
          flota:          (()=>{
            const f=String(r[col('FLOTA')]||'SP').trim().toUpperCase();
            if(['ADMINISTRATIVA','ADMIN'].includes(f)) return 'ADM';
            if(['PCB','PROTECCION CIVIL','PROTECCIÓN CIVIL'].includes(f)) return 'PC';
            if(['SEGURIDAD PUBLICA','SEGURIDAD PÚBLICA','SEGURIDAD'].includes(f)) return 'SP';
            return ['SP','ADM','PC'].includes(f)?f:'SP';
          })(),
          diasCarga:      String(r[col('DIAS CARGA')]||r[col('DIASCARGA')]||'todos').trim().toLowerCase() || 'todos',
          montoMensual:   (()=>{
            // Acepta columna "MONTO MENSUAL" o el nombre de cualquier mes en español
            const mesesEs=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
            let idx = col('MONTO MENSUAL'); if(idx<0) idx=col('MONTOMENSUAL');
            if(idx<0){ const mi=headers.findIndex(h=>mesesEs.includes(h.trim())); if(mi>=0) idx=mi; }
            return parseFloat(idx>=0?r[idx]:'')||0;
          })(),
          numCargas:      parseInt(r[col('CARGAS')]||r[col('NUM CARGAS')]||r[col('NUMCARGAS')]||0)||0,
        });
      }

      if(nuevas.length === 0){ alert('No se encontraron unidades en el archivo.'); return; }

      // Deduplicar por placa: si la misma placa aparece en varias flotas, la ÚLTIMA gana (ADM/PC > SP)
      const dedup = new Map();
      nuevas.forEach(u => dedup.set(u.placa, u));
      const unicas = [...dedup.values()];
      if(unicas.length < nuevas.length){
        console.warn(`Import: ${nuevas.length - unicas.length} placas duplicadas eliminadas`);
      }

      // Preguntar al usuario qué flota es (no depender de que el Excel tenga columna FLOTA)
      const flotaOpciones = ['SP - Seguridad Pública', 'ADM - Administrativa', 'PC - Protección Civil'];
      const flotaElegida = prompt(
        `¿A qué flota pertenecen estas ${nuevas.length} unidades?\n\n` +
        `Escribe:\n  SP   → Seguridad Pública\n  ADM  → Administrativa\n  PC   → Protección Civil\n\n` +
        `(Si tu Excel ya tiene columna FLOTA, escribe AUTO)`,
        'AUTO'
      );
      if(!flotaElegida) return;
      const flotaForzada = flotaElegida.trim().toUpperCase();

      // Si el usuario eligió una flota específica, sobreescribir el valor del Excel
      if(flotaForzada !== 'AUTO'){
        if(!['SP','ADM','PC'].includes(flotaForzada)){
          alert('Flota inválida. Escribe SP, ADM, PC o AUTO.'); return;
        }
        unicas.forEach(u=>{ u.flota = flotaForzada; });
      }

      // Detectar qué flotas vienen en el Excel
      const flotasEnExcel = [...new Set(unicas.map(u=>u.flota||'SP'))];
      const flotasStr = flotasEnExcel.join(', ');

      // Contar cuántas unidades de esas flotas hay actualmente
      const actualesEnFlota = S.unidades.filter(u=>flotasEnExcel.includes(u.flota||'SP'));

      const confirmMsg = `Se encontraron ${unicas.length} unidades únicas (Flota: ${flotasStr}).\n\n` +
        `¿Deseas REEMPLAZAR las ${actualesEnFlota.length} unidades actuales de la flota ${flotasStr}?\n\n` +
        `⚠️ Las demás flotas NO se tocan.`;
      if(!confirm(confirmMsg)) return;

      // Mostrar progreso
      S._cargando = true;
      render();

      // Guardar qué unidades estaban INACTIVAS antes de borrar (para restaurarlas)
      const inactivaSet = new Set(
        S.unidades
          .filter(u => flotasEnExcel.includes(u.flota||'SP') && u.estatus === 'INACTIVA')
          .map(u => `${u.placa}|${u.flota||'SP'}`)
      );

      // Eliminar SOLO las unidades de las flotas que vienen en el Excel
      for(const flota of flotasEnExcel){
        await db.from('unidades')
          .delete()
          .eq('user_id', _uid())
          .eq('flota', flota);
      }

      // Insertar nuevas en chunks
      const CHUNK = 20;
      for(let i = 0; i < unicas.length; i += CHUNK){
        const chunk = unicas.slice(i, i + CHUNK).map(u => ({
          placa:          u.placa,
          tarjeta:        u.tarjeta,
          estatus:        inactivaSet.has(`${u.placa}|${u.flota||'SP'}`) ? 'INACTIVA' : u.estatus,
          combustible:    u.combustible,
          tanque:         u.tanque,
          saldo:          u.saldo,
          tipocarga:      u.tipoCarga,
          idinicial:      u.idInicial,
          odometroactual: u.odometroActual,
          aumminodo:      u.aumMinOdo,
          aummaxodo:      u.aumMaxOdo,
          tipovehiculo:   u.tipoVehiculo,
          vehiculo:       u.vehiculo,
          marca:          u.marca,
          modelo:         u.modelo,
          observaciones:  u.observaciones||'',
          flota:          u.flota||'SP',
          dias_carga:     u.diasCarga||'todos',
          monto_mensual:  u.montoMensual||0,
          num_cargas:     u.numCargas||0,
          user_id:        _uid(),
        }));
        const { error } = await db.from('unidades').upsert(chunk, { onConflict: 'placa,flota,user_id', ignoreDuplicates: false });
        if(error) console.error('importar chunk', i, error.message);
      }

      // Recargar desde Supabase
      await cargarUnidades();
      S._cargando = false;
      alert(`✅ ${S.unidades.length} unidades importadas correctamente.`);
      nav('unidades');
      render();
    } catch(err){
      S._cargando = false;
      render();
      alert('Error al leer el archivo: ' + err.message);
      console.error(err);
    }
  };
  reader.readAsBinaryString(file);
  // Limpiar input para permitir subir el mismo archivo otra vez
  input.value = '';
}


async function cargarSabanas(){
  if(!_uid()) return;
  const { data, error } = await db.from('sabanas')
    .select('id,anio,mes,mes_nombre,presupuesto,precio_magna,precio_diesel,total_registros,total_importe,total_litros,created_at')
    .eq('user_id', _uid())
    .order('created_at', {ascending:false})
    .limit(50);
  if(error){ console.warn('cargarSabanas:', error.message); return; }
  if(data?.length){
    // Fusionar con historialSabanas local (Supabase tiene precedencia)
    S.historialSabanas = data.map(r=>({
      id: r.id,
      fecha: new Date(r.created_at).toLocaleString('es-MX'),
      anio: r.anio, mes: r.mes, mesNom: r.mes_nombre,
      presupuesto: r.presupuesto,
      precioMagna: r.precio_magna,
      precioDiesel: r.precio_diesel,
      totalRegistros: r.total_registros,
      totalImporte: r.total_importe,
      totalLitros: r.total_litros,
    }));
  }
}

async function cargarRegistrosSabana(sabanaId){
  const { data, error } = await db.from('sabanas')
    .select('registros').eq('id', sabanaId).eq('user_id', _uid()).maybeSingle();
  if(error||!data){ console.warn('cargarRegistrosSabana:', error?.message); return null; }
  return data.registros;
}

async function eliminarSabana(id){
  if(!confirm('¿Eliminar esta sábana del historial?')) return;
  S.historialSabanas = S.historialSabanas.filter(s=>s.id!==id);
  rerender();
  const { error } = await db.from('sabanas').delete().eq('id', id).eq('user_id', _uid());
  if(error) console.error('eliminarSabana:', error.message);
}

function _serGen(g){
  return {
    descuento:g.descuento, aumento:g.aumento,
    precioMagna:g.precioMagna, precioDiesel:g.precioDiesel, precioPremium:g.precioPremium,
    flota:g.flota, presupuesto:g.presupuesto,
    preciosPorDia:g.preciosPorDia, preciosDia:g.preciosDia,
    descansoCargaCompleta:g.descansoCargaCompleta,
    descansoCargaParcial:g.descansoCargaParcial,
    pctCargaCompleta:g.pctCargaCompleta,
    factorRendimiento:g.factorRendimiento??1,
  };
}
function _loadGen(dst, src){
  if(!src) return;
  if(src.descuento!=null)            dst.descuento            = src.descuento;
  if(src.aumento!=null)              dst.aumento              = src.aumento;
  if(src.precioMagna)                dst.precioMagna          = src.precioMagna;
  if(src.precioDiesel)               dst.precioDiesel         = src.precioDiesel;
  if(src.precioPremium)              dst.precioPremium        = src.precioPremium;
  if(src.presupuesto!=null)          dst.presupuesto          = src.presupuesto;
  if(src.preciosPorDia!=null)        dst.preciosPorDia        = src.preciosPorDia;
  if(src.preciosDia)                 dst.preciosDia           = src.preciosDia;
  if(src.descansoCargaCompleta!=null)dst.descansoCargaCompleta= src.descansoCargaCompleta;
  if(src.descansoCargaParcial!=null) dst.descansoCargaParcial = src.descansoCargaParcial;
  if(src.pctCargaCompleta!=null)     dst.pctCargaCompleta     = src.pctCargaCompleta;
  if(src.factorRendimiento!=null)    dst.factorRendimiento    = src.factorRendimiento;
}

async function _cargarConfig(){
  if(!_uid()) return;
  const { data, error } = await db.from('config')
    .select('data').eq('user_id', _uid()).maybeSingle();
  if(error){ console.warn('_cargarConfig error:', error.message); return; }
  if(!data?.data) return;
  const d = data.data;
  if(d.presupuestoMensual) S.presupuestoMensual = d.presupuestoMensual;
  if(d.posBomba)    S.posBomba    = d.posBomba;
  if(d.posConsumo)  S.posConsumo  = d.posConsumo;
  if(d.cfgConsumo)  S.cfgConsumo  = {...S.cfgConsumo, ...d.cfgConsumo};
  if(d.cfgBomba)    S.cfgBomba    = {...S.cfgBomba,   ...d.cfgBomba};
  if(d.tktFields)   S.tktFields   = d.tktFields;
  if(d.pin != null) S.pin         = d.pin;
  if(d.emailjsKey)       S.emailjsKey       = d.emailjsKey;
  if(d.emailjsService)   S.emailjsService   = d.emailjsService;
  if(d.emailjsTemplate)  S.emailjsTemplate  = d.emailjsTemplate;
  if(d.adminEmail)       S.adminEmail       = d.adminEmail;
  if(d.historialSabanas) S.historialSabanas = d.historialSabanas;
  _loadGen(S.gen,    d.gen);
  _loadGen(S.genADM, d.genADM);
  _loadGen(S.genPC,  d.genPC);
}

// ===================== CRUD: UNIDADES =====================
async function cargarUnidades(){
  if(!_uid()) return;
  const { data, error } = await db.from('unidades')
    .select('*').eq('user_id', _uid()).order('placa');
  if(error){ console.error('cargarUnidades:', error.message); return; }
  S.unidades = (data||[]).map(_mapUnidad);
}

async function guardarUnidad(u){
  _assertAuth();
  const row = _unidadToRow(u);
  // Verificar si ya existe
  const { data: existe } = await db.from('unidades')
    .select('id').eq('placa', u.placa).eq('user_id', _uid()).maybeSingle();
  let error;
  if(existe){
    ({ error } = await db.from('unidades')
      .update({...row, user_id: _uid()}).eq('placa', u.placa).eq('user_id', _uid()));
  } else {
    ({ error } = await db.from('unidades')
      .insert({...row, user_id: _uid()}));
  }
  if(error) throw new Error('guardarUnidad: ' + error.message);
  await cargarUnidades();
  rerender();
}

async function actualizarUnidad(placa, cambios){
  _assertAuth();
  const row = {};
  if(cambios.saldo         !== undefined) row.saldo          = Number(cambios.saldo)||0;
  if(cambios.idInicial     !== undefined) row.idinicial       = Number(cambios.idInicial)||52;
  if(cambios.odometroActual!== undefined) row.odometroactual  = Number(cambios.odometroActual)||0;
  if(cambios.tipoCarga     !== undefined) row.tipocarga       = cambios.tipoCarga;
  if(cambios.estatus       !== undefined) row.estatus         = cambios.estatus;
  if(cambios.tipoVehiculo  !== undefined) row.tipovehiculo    = cambios.tipoVehiculo;
  if(cambios.flota         !== undefined) row.flota           = cambios.flota;
  if(cambios.diasCarga     !== undefined) row.dias_carga      = cambios.diasCarga;
  if(cambios.montoMensual  !== undefined) row.monto_mensual   = cambios.montoMensual;
  if(cambios.numCargas     !== undefined) row.num_cargas      = cambios.numCargas;
  if(!Object.keys(row).length) return;
  const { error } = await db.from('unidades')
    .update(row).eq('placa', placa).eq('user_id', _uid());
  if(error) throw new Error('actualizarUnidad: ' + error.message);
  await cargarUnidades();
  rerender();
}

async function eliminarUnidad(placa){
  _assertAuth();
  const { error } = await db.from('unidades')
    .delete().eq('placa', placa).eq('user_id', _uid());
  if(error) throw new Error('eliminarUnidad: ' + error.message);
  await cargarUnidades();
  rerender();
}

// Mapeo columnas DB → objeto S
function _mapUnidad(r){
  return {
    _dbId: r.id,
    placa: r.placa, tarjeta: r.tarjeta, estatus: r.estatus,
    combustible: r.combustible, tanque: Number(r.tanque)||0,
    saldo: Number(r.saldo)||0,
    tipoCarga: r.tipocarga, idInicial: Number(r.idinicial)||52,
    odometroActual: Number(r.odometroactual)||0,
    aumMinOdo: Number(r.aumminodo)||0,
    aumMaxOdo: Number(r.aummaxodo)||0,
    observaciones: r.observaciones||'',
    tipoVehiculo: r.tipovehiculo, vehiculo: r.vehiculo||'',
    marca: r.marca||'', modelo: Number(r.modelo)||0,
    flota: r.flota||'SP',

// Override doLogin para usar Supabase Auth
async function doLogin(){
  const u = S.loginInput.usuario.trim();
  const p = S.loginInput.password;
  if(!u||!p){ S.loginError='Ingresa usuario y contraseña.'; render(); return; }

  // Intentar con email directo o buscar email por username
  let email = u;
  // Si no tiene @ asumir que es un username → buscar en tabla usuarios_app
  if(!u.includes('@')){
    const { data: found } = await db.from('usuarios_app')
      .select('email').eq('username', u).maybeSingle();
    if(found?.email) email = found.email;
    else {
      S.loginError = 'Usuario no encontrado.';
      render(); return;
    }
  }

  const { data, error } = await db.auth.signInWithPassword({ email, password: p });
  if(error){
    S.loginError = 'Usuario o contraseña incorrectos.';
    render(); return;
  }

  _currentUser = data.user;
  S.loggedIn = true;
  S.loginError = '';
  S.loginInput = {usuario:'', password:''};
  S._usuarioActual = { id: data.user.id, usuario: u, email: data.user.email,
    nombre: data.user.user_metadata?.nombre || u, rol: data.user.user_metadata?.rol || 'operador' };

  // Cargar todos los datos del usuario
  await _cargarTodo();
  render();
}

async function doLogout(){
  if(!confirm('¿Cerrar sesión?')) return;
  await db.auth.signOut();
  _currentUser = null;
  S.loggedIn = false;
  S.pinUnlocked = false;
  S._usuarioActual = null;
  S.loginInput = {usuario:'', password:''};
  // Limpiar datos en memoria
  S.unidades = []; S.consumos = []; S.gasolineras = [];
  render();
}

  const u = S.unidades.find(x=>x.placa===S.cap.placa);

  const litros = parseFloat(S.cap.litros||0);
  if(!litros||litros<=0){ alert('Ingresa los litros.'); return; }

  const {importe,iva,sub} = calcMontos(litros, precio);
  const imp = _origGuardarCaptura ? null : null; // usamos nuestro propio build

  const rend = (lit>0&&kf2>ki2) ? ((kf2-ki2)/lit).toFixed(2) : '0.00';

  const consumo = {
    tarjeta: u.tarjeta, tipoTarjeta: 'CH', placa: u.placa,
    fecha: fechaHoy + ' ' + hora, id: getNextId(u.placa),

    domicilio: g.direccion, colonia: g.colonia, ciudad: g.ciudad,
    estado: g.estado, rfc: g.rfc, producto: u.combustible, precio,
    kmIni: ki2, kmFin: kf2, litros: lit, rendimiento: rend,
    iva: '16%', consumo: 'Normal',
    usuario: 'MUNICIPIO DE ' + (g.municipio||'').toUpperCase(),
    centroCosto: 'SEGURIDAD PUBLICA', expediente: '0', tagFolio: '0',

    folio: String(getNextFolio()), notaNum: String(getNextNota()),
    municipio: g.municipio||'',
  };

  try {
    await guardarConsumo(consumo);

    rerender();
    setTimeout(()=>{ S.capSuccess=false; rerender(); }, 3000);

    alert('Error guardando: ' + e.message);

  const estado = _G(flota||'SP')._estadoFinal;

    if(!st) return;

      odometroActual: (u.odometroActual>0 && st.odometroFinal>0) ? st.odometroFinal : u.odometroActual });

  // Batch update
  for(const upd of updates){
    await actualizarUnidad(upd.placa, {idInicial: upd.idInicial, odometroActual: upd.odometroActual});
  }
  saveState(); // config
  alert(`✅ ${updates.length} unidades actualizadas.`);
  render();
}

      _cargarConfig(),
      cargarUnidades(),
      cargarConsumos(),
      cargarGasolineras(),
      cargarSabanas(),
    ]);
    // ── Carga inicial: si no hay unidades para este usuario, subir UNITS_DATA ──
    if(S.unidades.length === 0 && typeof UNITS_DATA !== 'undefined' && UNITS_DATA.length > 0){
      // Verificar en Supabase directamente (por si el select inicial falló)
      const { count } = await db.from('unidades')
        .select('*', { count:'exact', head:true }).eq('user_id', _uid());
      if((count||0) === 0){
        console.log('Primera vez: subiendo', UNITS_DATA.length, 'unidades...');
        await _seedUnidades();
      }
      await cargarUnidades();
      console.log('✅ Unidades en pantalla:', S.unidades.length);
    }
    // ── Carga inicial: si no hay gasolinera para este usuario ────────────
    if(S.gasolineras.length === 0 && typeof initGas !== 'undefined' && initGas.length > 0){
      const { count: cntGas } = await db.from('gasolineras')
        .select('*', { count:'exact', head:true }).eq('user_id', _uid());
      if((cntGas||0) === 0){
        await _seedGasolineras();
      }
      await cargarGasolineras();
    }
  } catch(e){
    console.error('_cargarTodo error:', e);
  } finally {
    S._cargando = false;
    render();
  }
}

async function _seedUnidades(){
  const CHUNK = 20;
  for(let i = 0; i < UNITS_DATA.length; i += CHUNK){
    const chunk = UNITS_DATA.slice(i, i + CHUNK).map(u => ({
      placa:          u.placa,
      tarjeta:        u.tarjeta,
      estatus:        u.estatus,
      combustible:    u.combustible,
      tanque:         u.tanque,
      saldo:          u.saldo,
      tipocarga:      u.tipoCarga,
      idinicial:      u.idInicial,
      odometroactual: u.odometroActual,
      aumminodo:      u.aumMinOdo,
      aummaxodo:      u.aumMaxOdo,
      tipovehiculo:   u.tipoVehiculo,
      vehiculo:       u.vehiculo,
      marca:          u.marca,
      modelo:         u.modelo,
      observaciones:  u.observaciones || '',
      user_id:        _uid(),
    }));
    const { error } = await db.from('unidades').insert(chunk);
    if(error) console.error('_seedUnidades chunk', i, error.message);
    else console.log(`  ✅ Procesadas ${Math.min(i + CHUNK, UNITS_DATA.length)}/${UNITS_DATA.length}`);
  }
}

    clave_cliente:    g.claveCliente,
    permiso:          g.permiso,
    regimen_fiscal:   g.regimenFiscal,
    lugar_expedicion: g.lugarExpedicion,
    user_id:          _uid(),
  }));
  const { error } = await db.from('gasolineras').insert(rows);
  if(error) console.error('_seedGasolineras:', error.message);
  else console.log('✅ Gasolinera default insertada');
}

// ===================== INIT =====================
async function eliminarUnidadSupabase(placa){
  if(!confirm('¿Eliminar esta unidad?')) return;
  const idx = S.unidades.findIndex(u=>u.placa===placa);
  if(idx>=0) S.unidades.splice(idx,1);
  rerender();
  try { await eliminarUnidad(placa); }
  catch(e){ console.error('eliminarUnidad:', e); alert('Error: '+e.message); }
}

async function initApp(){
  try {
    // Verificar sesión activa
    const { data: { session }, error } = await db.auth.getSession();
    if(error) console.warn('getSession error:', error.message);
    if(session){
      _currentUser = session.user;
      S.loggedIn = true;
      S._usuarioActual = {
        id: session.user.id,
        usuario: session.user.email,
        email: session.user.email,
        nombre: session.user.user_metadata?.nombre || session.user.email,
        rol: session.user.user_metadata?.rol || 'operador',
      };
      await _cargarTodo();
    }
  } catch(e){
    console.error('initApp error:', e);
    S._cargando = false;
    render(); // mostrar login aunque Supabase falle
  }

  // Listener de cambios de sesión
  db.auth.onAuthStateChange(async (event, session) => {
    if(event === 'SIGNED_OUT'){
      _currentUser = null;
      S.loggedIn = false; S.pinUnlocked = false;
      S._usuarioActual = null;
      S.unidades = []; S.consumos = []; S.gasolineras = [];
      render();
    } else if(event === 'SIGNED_IN' && session){
      _currentUser = session.user;
    }
  });

  // Siempre llamar render al final, tenga sesión o no
  render();
}

// Mostrar spinner mientras carga
// Sin override de render — carga en background sin bloquear UI

initApp();
