<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}
:root{--blue:#1e40af;--orange:#f97316;--green:#059669;--red:#dc2626;--border:#e2e8f0;--bg:#fff;--bg2:#f8fafc;--muted:#64748b;--radius:10px}
.app-head{background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#fff;padding:13px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.app-head .logo{font-size:26px}
.app-head h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.app-head p{font-size:11px;color:#93c5fd;margin-top:1px}
.app-head .hdr-right{margin-left:auto;text-align:right}
.app-head .budget-bar{font-size:12px;color:#bfdbfe}
.app-head .budget-num{font-size:15px;font-weight:700;color:#fff}
.app-nav{background:#1e3a8a;display:flex;overflow-x:auto;position:sticky;top:58px;z-index:99;border-bottom:1px solid rgba(255,255,255,.1)}
.app-nav::-webkit-scrollbar{height:3px}.app-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
.app-nav button{padding:11px 20px;border:none;background:transparent;color:#bfdbfe;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:all .15s;border-bottom:3px solid transparent}
.app-nav button.act{color:#fff;border-bottom-color:#f97316}
.app-nav button:hover:not(.act){background:rgba(255,255,255,.08);color:#fff}
.body{padding:16px;max-width:900px;margin:0 auto}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px}
.card-title{font-size:16px;font-weight:700;color:#0f172a}
.fg{margin-bottom:13px}
.fl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
.fi{width:100%;padding:8px 11px;border-radius:7px;border:1.5px solid var(--border);font-size:13px;color:#1e293b;background:#fff;outline:none;transition:border .15s}
.fi:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.fi.ro{background:var(--bg2);color:var(--muted);cursor:default}
.fi.err{border-color:var(--red)}
.fi.good{border-color:var(--green)}
.em{font-size:11px;color:var(--red);margin-top:3px}
.gm{font-size:11px;color:var(--green);margin-top:3px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.btn{padding:8px 16px;border:1.5px solid transparent;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-p{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-b{background:#eff6ff;color:#1e40af;border-color:#bfdbfe}
.btn-g{background:#f0fdf4;color:#166534;border-color:#86efac}
.btn-r{background:#fef2f2;color:var(--red);border-color:#fecaca}
.btn-n{background:var(--bg2);color:#374151;border-color:var(--border)}
.btn-full{width:100%;padding:12px;font-size:14px;justify-content:center}
.badge{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;display:inline-block}
.bg{background:#f0fdf4;color:#166534}
.br{background:#fef2f2;color:#dc2626}
.ba{background:#fffbeb;color:#92400e}
.bb{background:#eff6ff;color:#1e40af}
.bp{background:#fdf4ff;color:#7e22ce}
.summary{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:8px;padding:14px 18px;margin-bottom:16px}
.sum-row{display:flex;justify-content:space-between;font-size:13px;color:#1e40af;margin-bottom:4px}
.sum-total{font-size:17px;font-weight:700;color:#1e3a8a}
.sum-warn{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;border-radius:8px;padding:14px 18px;margin-bottom:16px}
.sum-warn .sum-row{color:#92400e}
.sum-warn .sum-total{color:#78350f}
.budget-progress{background:#e2e8f0;border-radius:99px;height:8px;margin-top:6px;overflow:hidden}
.budget-fill{height:100%;border-radius:99px;transition:width .4s}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--bg2);border-radius:8px;padding:13px 15px;border:1px solid var(--border)}
.stat-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:800;color:#0f172a}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px}
.alert-s{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:11px 15px;margin-bottom:14px;font-size:13px;color:#166534;font-weight:500}
.alert-d{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:11px 15px;margin-bottom:14px;font-size:13px;color:#dc2626;font-weight:500}
.alert-w{background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:11px 15px;margin-bottom:14px;font-size:13px;color:#92400e;font-weight:500}
.back-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-bar h2{font-size:15px;font-weight:700;color:#0f172a}
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:9px 11px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg2);border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
.tbl td{padding:8px 11px;border-bottom:1px solid #f1f5f9;color:#1e293b;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f8fafc}
.item-card{border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--bg)}
.ic-info h3{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:2px}
.ic-info p{font-size:12px;color:var(--muted)}
.ic-acts{display:flex;gap:6px;flex-shrink:0}
.search-wrap{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search-inp{padding:8px 12px;border-radius:7px;border:1.5px solid var(--border);font-size:13px;color:#1e293b;background:#fff;outline:none;min-width:180px}
.search-inp:focus{border-color:#3b82f6}
.tkt-frame{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;max-width:310px;margin:0 auto}
.tkt{font-family:'Courier New',Courier,monospace;font-size:11.5px;line-height:1.65;color:#111;padding:8px}
.tkt-c{text-align:center}
.tkt-b{font-weight:700}
.tkt-div{border-top:1.5px dashed #aaa;margin:6px 0}
.tkt-row{display:flex;justify-content:space-between}
.tkt-big{font-size:15px;font-weight:800}
.tkt-qr{width:70px;height:70px;background:#f3f4f6;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:9px;color:#999;margin:0 auto 8px}
.tkt-bar{width:88%;height:28px;margin:8px auto;background:repeating-linear-gradient(90deg,#111 0,#111 2px,#fff 2px,#fff 5px);border-radius:1px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{padding:7px 16px;border-radius:7px;border:1.5px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;background:var(--bg2);color:var(--muted);transition:all .15s}
.tab.act{background:#1e40af;color:#fff;border-color:#1e40af}
.rend-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600}
.rend-ok{background:#f0fdf4;color:#166534}
.rend-warn{background:#fffbeb;color:#92400e}
.rend-bad{background:#fef2f2;color:#dc2626}
.no-data{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.cfg-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f5f9}
.cfg-row:last-child{border-bottom:none}
.cfg-label{font-size:13px;font-weight:600;color:#0f172a}
.cfg-sub{font-size:11px;color:var(--muted);margin-top:1px}
.cfg-val{font-size:22px;font-weight:800;color:#1e40af}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.g2.force{grid-template-columns:repeat(2,1fr)}}
@media print{.app-head,.app-nav,.body>*:not(.tkt-frame){display:none!important}.tkt-frame{box-shadow:none;border:none;max-width:100%}}
</style>

// ===================== UTILS =====================
function today(){ return new Date().toISOString().split('T')[0]; }
function nowTime(){ return new Date().toTimeString().slice(0,8); }
function fmtLit(n){
  // 42.420 → "42.42", 42.003 → "42.003", 42.400 → "42.4"
  return parseFloat(Number(n||0).toFixed(3)).toString();
}
function fmtFechaTicket(fecha,hora,folio){
  // "2026-02-02","09:01:25","6184902" → "2026/02/02. 09:01 (61849020)"
  const f=(fecha||'').replace(/-/g,'/');
  const h=(hora||'').slice(0,5);
  return `${f}. ${h} (${folio}0)`;
}
function randHora(){
  // Hora aleatoria entre 07:00 y 11:59 para la sábana
  const h=Math.floor(Math.random()*5)+7; // 7-11
  const m=Math.floor(Math.random()*60);
  const s=Math.floor(Math.random()*60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Centavo-safe math: todos los monetos se operan como enteros de centavos
// para evitar errores de punto flotante acumulados
function toCents(v){ return Math.round(parseFloat(v||0)*100); }
function fromCents(c){ return c/100; }
function fmt(n){
  // Redondea al centavo más cercano antes de formatear
  const rounded = Math.round(Number(n||0)*100)/100;
  return rounded.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtN(n){ return Number(n||0).toLocaleString('es-MX'); }

// Calcula importe, IVA y subtotal con centavos exactos
// IVA incluido en precio: Total = precio*litros; IVA = round(Total*16/116); Sub = Total-IVA
// Garantiza Sub+IVA == Total exactamente
function calcMontos(litros, precio){
  const litroCents = toCents(litros);   // litros en milésimas → usamos float pero redondeado
  const precioCents = toCents(precio);
  // importe = round(litros * precio, 2) — operamos con floats pero redondeamos inmediatamente
  const importeCents = Math.round(parseFloat(litros||0) * parseFloat(precio||0) * 100);
  const ivaCents = Math.round(importeCents * 16 / 116);
  const subCents = importeCents - ivaCents;  // exacto: sub + iva = importe
  return {
    importeCents, ivaCents, subCents,
    importe: fromCents(importeCents),
    iva:     fromCents(ivaCents),
    sub:     fromCents(subCents),
  };
}

// Suma de centavos de un array de consumos — sin acumulación de error
function sumImportesCents(consumos){
  return consumos.reduce((acc,c)=>acc+toCents(c.importe),0);
}

function numWords(n){
  n=Math.floor(n); if(n===0)return'CERO';
  const u=['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE'];
  const t=['','DIEZ','VEINTE','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const h=['','CIEN','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  if(n<20)return u[n];
  if(n<100){const d=Math.floor(n/10),r=n%10;return r?t[d]+' Y '+u[r]:t[d];}
  if(n<1000){const d=Math.floor(n/100),r=n%100;const hw=(d===1&&r)?'CIENTO':h[d];return r?hw+' '+numWords(r):hw;}
  if(n<1000000){const k=Math.floor(n/1000),r=n%1000;const kw=k===1?'MIL':numWords(k)+' MIL';return r?kw+' '+numWords(r):kw;}
  return n.toString();
}
function moneyWords(a){
  const p=Math.floor(a),c=Math.round((a-p)*100);
  return`(${numWords(p)} PESOS ${String(c).padStart(2,'0')}/100 M.N.)`;
}

function getMonthConsumos(m,y){
  if(!m||!y){ const d=new Date(); m=d.getMonth()+1; y=d.getFullYear(); }
  return S.consumos.filter(c=>{
    const fd=new Date(c.fecha); return fd.getMonth()+1===m && fd.getFullYear()===y;
  });
}
function getMonthSpent(m,y){
  return fromCents(sumImportesCents(getMonthConsumos(m,y)));
}
function getGas(municipio){ return S.gasolineras.find(g=>g.municipio===(municipio||S.cap.municipio))||S.gasolineras[0]; }
function getUnit(placa){ return S.unidades.find(u=>u.placa===(placa||S.cap.placa)); }

function getNextId(placa){
  // ID increases by 2 for each load of this unit
  const unitConsumos = S.consumos.filter(c=>c.placa===placa);
  const unit = S.unidades.find(u=>u.placa===placa);
  const base = unit?.idInicial || 52;
  return base + (unitConsumos.length * 2);
}

function getNextFolio(){
  if(!S.consumos.length) return parseInt(S.cfgBomba.folioInicial)||61021000;
  return Math.max(...S.consumos.map(c=>parseInt(c.folio)||parseInt(S.cfgBomba.folioInicial)))+1;
}
function getNextNota(){
  if(!S.consumos.length) return parseInt(S.cfgBomba.notaInicial)||1042000;
  return Math.max(...S.consumos.map(c=>parseInt(c.notaNum)||parseInt(S.cfgBomba.notaInicial)))+1;
}
function getNextWebId(){
  if(!S.consumos.length) return parseInt(S.cfgBomba.webIdInicial)||85110000;
  return Math.max(...S.consumos.map(c=>parseInt(c.webId)||parseInt(S.cfgBomba.webIdInicial)))+1;
}

async function guardarCaptura(){
  const E={};
  if(!S.cap.municipio) E.municipio='Selecciona un municipio';
  if(!S.cap.placa) E.placa='Selecciona una unidad';
  const lit=parseFloat(S.cap.litros);
  if(!lit||lit<=0) E.litros='Ingresa litros válidos';
  const pre=parseFloat(S.cap.precio);
  if(!pre||pre<=0) E.precio='Ingresa precio válido';
  const ki=parseFloat(S.cap.kmIni)||0, kf=parseFloat(S.cap.kmFin)||0;
  if(kf>0&&kf<ki) E.kmFin='Debe ser mayor al odómetro anterior';
  S.capErrors=E;
  if(Object.keys(E).length){rerender();return;}

  const u=getUnit(), g=getGas();
  const {importe:imp,iva,sub} = calcMontos(lit,pre);
  const spent=getMonthSpent();
  if((spent+imp)>S.presupuestoMensual){
    if(!confirm(`⚠️ Esta carga ($${fmt(imp)}) excederá el presupuesto mensual.\nDisponible: $${fmt(S.presupuestoMensual-spent)}\n\n¿Deseas registrarla de todas formas?`)) return;
  }

  const idConsumo=getNextId(u?.placa||S.cap.placa);
  const folio=S.cap.folioManual||getNextFolio();
  const notaNum=S.cap.notaManual||getNextNota();
  const ki2=parseFloat(S.cap.kmIni)||0, kf2=parseFloat(S.cap.kmFin)||0;
  const rend=(lit>0&&kf2>ki2)?((kf2-ki2)/lit).toFixed(2):'0.00';

  const c={
    id:Date.now(), folio, notaNum, idConsumo,
    municipio:S.cap.municipio, gasolineraId:g?.id||1,
    placa:u?.placa||S.cap.placa, tarjeta:u?.tarjeta||'',
    combustible:u?.combustible||'Magna',
    fecha:S.cap.fecha, hora:S.cap.hora,
    litros:lit, precio:pre, importe:imp, iva, sub,
    ivaNum:iva, tipoTarjeta:'CH',
    concepto:'Consumo', estacion:g?.estacionId||'',
    nombre:g?.nombre||'', domicilio:g?.direccion||'',
    colonia:g?.colonia||'', ciudad:g?.ciudad||'',
    estado:g?.estado||'', rfc:g?.rfc||'',
    producto:u?.combustible||'Magna',
    kmIni:ki2, kmFin:kf2, rendimiento:rend,
    iva:'16%', consumo:'Normal',
    usuario:'MUNICIPIO DE '+(g?.municipio||'').toUpperCase(),
    centroCosto:'SEGURIDAD PUBLICA', expediente:'0', tagFolio:'0',
    posicion:S.cap.posicion||'4', terminal:S.cap.terminal||'4',
    webId:S.cap.webId||String(getNextWebId()),
    numUnico:S.cap.numUnico||String(idConsumo),
    formaPago:S.cap.formaPago||'EFECTIVO',
    saldoTarjeta:Math.max(0,(u?.saldo||0)-imp).toFixed(2),
  };

  // Actualizar UI inmediatamente
  S.consumos.unshift(c);
  if(u&&kf2>0){
    const idx=S.unidades.findIndex(x=>x.placa===u.placa);
    if(idx>=0) S.unidades[idx].odometroActual=kf2;
  }
  S.capSuccess=true;
  S.cap={municipio:S.cap.municipio,placa:'',fecha:today(),hora:nowTime(),litros:'',precio:'',kmIni:'',kmFin:'',posicion:'4',terminal:'4',webId:'',numUnico:'',formaPago:'EFECTIVO',folioManual:'',notaManual:''};
  S.capErrors={};
  rerender();
  setTimeout(()=>{ S.capSuccess=false; S.ticketData=c; S.view='ticket'; render(); },800);

  // Guardar en Supabase en background
  try {
    await guardarConsumo(c);
    if(u&&kf2>0) await actualizarUnidad(u.placa, {odometroActual:kf2});
  } catch(e){ console.error('guardarCaptura Supabase:', e.message); }
}

function iniciarEdicionUnidad(placa){
  const u=S.unidades.find(x=>x.placa===placa);
  if(!u) return;
  S.editingUnit=placa;
  S.editingUnitData={
    saldo:u.saldo, idInicial:u.idInicial,
    odometroActual:u.odometroActual,
    tipoCarga:u.tipoCarga, estatus:u.estatus
  };
  rerender();
}

async function guardarEdicionUnidad(placa){
  const idx=S.unidades.findIndex(x=>x.placa===placa);
  if(idx<0) return;
  const eD=S.editingUnitData||{};
  const cambios={};
  if(eD.saldo!=null){S.unidades[idx].saldo=eD.saldo; cambios.saldo=eD.saldo;}
  if(eD.idInicial!=null){S.unidades[idx].idInicial=eD.idInicial; cambios.idInicial=eD.idInicial;}
  if(eD.odometroActual!=null){S.unidades[idx].odometroActual=eD.odometroActual; cambios.odometroActual=eD.odometroActual;}
  if(eD.tipoCarga){S.unidades[idx].tipoCarga=eD.tipoCarga; cambios.tipoCarga=eD.tipoCarga;}
  if(eD.estatus){S.unidades[idx].estatus=eD.estatus; cambios.estatus=eD.estatus;}
  if(eD.flota){S.unidades[idx].flota=eD.flota; cambios.flota=eD.flota;}
  if(eD.diasCarga!=null){S.unidades[idx].diasCarga=eD.diasCarga; cambios.diasCarga=eD.diasCarga;}
  if(eD.montoMensual!=null){S.unidades[idx].montoMensual=eD.montoMensual; cambios.montoMensual=eD.montoMensual;}
  if(eD.numCargas!=null){S.unidades[idx].numCargas=eD.numCargas; cambios.numCargas=eD.numCargas;}
  S.editingUnit=null;
  S.editingUnitData={};
  rerender();
  if(Object.keys(cambios).length)
    actualizarUnidad(placa, cambios).catch(e=>console.error('guardarEdicionUnidad:', e.message));
}

function verTickets(id,tipo){
  const c=S.consumos.find(x=>String(x.id)===String(id));
  if(!c)return;
  S.ticketData=c;S.ticketType=tipo||'bomba';S.view='ticket';render();
}
async function borrarConsumo(id){
  if(!confirm('¿Eliminar este registro?'))return;
  const c=S.consumos.find(x=>String(x.id)===String(id));
  S.consumos=S.consumos.filter(x=>String(x.id)!==String(id));
  rerender();
  if(c?._dbId) eliminarConsumo(c._dbId).catch(e=>console.error('borrarConsumo:', e.message));
}

function editImpresora(tipo){
  const cur=tipo==='bomba'?S.posBomba:S.posConsumo;
  const v=prompt(`Nombre de la impresora POS para ticket ${tipo}:`,cur);
  if(v&&v.trim()){
    if(tipo==='bomba') S.posBomba=v.trim();
    else S.posConsumo=v.trim();
    saveState(); render();
  }
}
function editPresupuesto(){
  // Usamos un div inline en lugar de prompt() que algunos navegadores bloquean
  S.modal={type:'presupuesto', val:S.presupuestoMensual}; render();
}
function savePresupuesto(){
  const inp=document.getElementById('pres-inp');
  const n=parseFloat(inp?.value);
  if(!isNaN(n)&&n>0){ S.presupuestoMensual=n; S.modal=null; saveState(); render(); }
  else { inp&&(inp.style.borderColor='#dc2626'); }
}
async function clearData(){
  if(!confirm('¿Seguro que deseas borrar todo el historial de consumos? Esta acción no se puede deshacer.')) return;
  S.consumos=[];
  render();
  const { error } = await db.from('consumos').delete().eq('user_id', _uid());
  if(error) console.error('clearData:', error.message);
}

function openExportModal(){
  const now=new Date();
  S.modal={type:'exportMes',mes:now.getMonth()+1,anio:now.getFullYear()};
  render();
  // Actualizar info después de render
  setTimeout(()=>{
    const m=parseInt(document.getElementById('exp-mes')?.value)||now.getMonth()+1;
    const a=parseInt(document.getElementById('exp-anio')?.value)||now.getFullYear();
    const cnt=getMonthConsumos(m,a).length;
    const inf=document.getElementById('exp-info');
    if(inf) inf.textContent=`${cnt} registros encontrados para ese período`;
  },100);
}
function doExportCSV(){
  const mes=parseInt(document.getElementById('exp-mes')?.value)||new Date().getMonth()+1;
  const anio=parseInt(document.getElementById('exp-anio')?.value)||new Date().getFullYear();
  S.modal=null;
  exportCSV(mes,anio);
}
function exportCSV(mes,anio){
  if(!mes||!anio){const now=new Date();mes=now.getMonth()+1;anio=now.getFullYear();}
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const headers=['Tarjeta','Tipo Tarjeta','Placa','Fecha','ID','Cargo','Abono','Saldo','Concepto','Estacion','Nombre','Domicilio','Colonia','Ciudad','Estado','RFC','Producto','Precio','Km INI','Km FIN','Litros','Rendimiento','IVA','Consumo','Usuario','Centro Costo'];
  const filtrados=getMonthConsumos(mes,anio);
  if(!filtrados.length){alert(`Sin registros para ${meses[mes-1]} ${anio}`);return;}
  const rows=filtrados.map(c=>{
    const g=S.gasolineras.find(x=>x.id===c.gasolineraId)||S.gasolineras[0];
    return[
      c.tarjeta,'CH',c.placa,`${c.fecha} ${randHora()}`,c.idConsumo,
      c.importe.toFixed(2),0,c.saldoTarjeta,
      'Consumo',g?.estacionId||'',g?.nombre||'',g?.direccion||'',g?.colonia||'',
      g?.ciudad||'',g?.estado||'',g?.rfc||'',c.combustible,c.precio,
      c.kmIni,c.kmFin,c.litros,c.rendimiento,(c.iva||0).toFixed(2),'Normal',
      'MUNICIPIO DE '+(c.municipio||'').toUpperCase(),'SEGURIDAD PUBLICA'
    ].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',');
  });
  const csv=[headers.join(','),...rows].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`sabana_consumo_${String(anio)}_${String(mes).padStart(2,'0')}_${meses[mes-1]}.csv`;
  a.click();
}


// ===================== CUADRE =====================
function renderCuadre(){
  const mc = getMonthConsumos();
  const now = new Date();
  const mes = now.toLocaleString('es-MX',{month:'long',year:'numeric'});

  // Totales en centavos — sin punto flotante
  const totalImpCents = sumImportesCents(mc);
  const totalIvaCents  = mc.reduce((a,c)=>a+toCents(c.iva),0);
  const totalSubCents  = mc.reduce((a,c)=>a+toCents(c.sub||c.importe-c.iva),0);
  const totalLit       = mc.reduce((a,c)=>a+parseFloat(c.litros||0),0);

  // Verificación de cuadre: sub + iva debe ser exactamente igual a importe (en centavos)
  const diffCents = totalImpCents - (totalSubCents + totalIvaCents);
  const cuadraOk  = diffCents === 0;

  // Cuadre por unidad
  const byPlaca = {};
  mc.forEach(c=>{
    if(!byPlaca[c.placa]) byPlaca[c.placa]={placa:c.placa,cargas:0,litros:0,impCents:0,ivaCents:0,subCents:0};
    const b=byPlaca[c.placa];
    b.cargas++;
    b.litros+=parseFloat(c.litros||0);
    b.impCents+=toCents(c.importe);
    b.ivaCents+=toCents(c.iva);
    b.subCents+=toCents(c.sub||c.importe-c.iva);
  });
  const placaRows = Object.values(byPlaca).sort((a,b)=>parseInt(a.placa)-parseInt(b.placa));

  // Verifica cada fila: sub+iva==importe en centavos
  const rowsOk = placaRows.every(r=>r.impCents===(r.subCents+r.ivaCents));

  return`<div>
<div class="card">
<div class="card-head"><h2 class="card-title">🔢 Cuadre de Consumos — ${mes}</h2>
<span class="badge ${cuadraOk&&rowsOk?'bg':'br'}">${cuadraOk&&rowsOk?'✅ CUADRADO':'⚠️ DIFERENCIA'}</span>
</div>

<div class="stat-grid" style="margin-bottom:20px">
<div class="stat"><div class="stat-label">Total cargas</div><div class="stat-val">${mc.length}</div><div class="stat-sub">${totalLit.toFixed(3)} litros</div></div>
<div class="stat"><div class="stat-label">Subtotal (sin IVA)</div><div class="stat-val" style="font-size:17px">$${fmt(fromCents(totalSubCents))}</div></div>
<div class="stat"><div class="stat-label">IVA 16%</div><div class="stat-val" style="font-size:17px">$${fmt(fromCents(totalIvaCents))}</div></div>
</div>

<div class="summary" style="margin-bottom:20px">
<div class="sum-row"><span>Subtotal acumulado</span><span>$${fmt(fromCents(totalSubCents))}</span></div>
<div class="sum-row"><span>IVA acumulado (16%)</span><span>$${fmt(fromCents(totalIvaCents))}</span></div>
<div class="sum-row sum-total"><span><b>Total facturado</b></span><span><b>$${fmt(fromCents(totalImpCents))}</b></span></div>
<div class="sum-row" style="margin-top:10px;font-size:12px">
<span>Verificación Sub+IVA vs Total</span>
<span style="font-weight:700;color:${cuadraOk?'#059669':'#dc2626'}">
  ${cuadraOk?`✅ $${fmt(fromCents(totalSubCents+totalIvaCents))} = $${fmt(fromCents(totalImpCents))}`:`⚠️ Diferencia: $${fmt(fromCents(diffCents))}`}
</span>
</div>
<div class="sum-row" style="font-size:12px">
<span>Presupuesto mensual</span><span>$${fmt(S.presupuestoMensual)}</span>
</div>
<div class="sum-row" style="font-size:12px">
<span>Disponible restante</span>
<span style="font-weight:700;color:${fromCents(totalImpCents)<=S.presupuestoMensual?'#059669':'#dc2626'}">
  $${fmt(S.presupuestoMensual-fromCents(totalImpCents))}
</span>
</div>
</div>

${mc.length===0?`<div class="no-data">Sin registros este mes.</div>`:`
<h3 style="font-size:14px;font-weight:700;margin-bottom:10px;color:#0f172a">Cuadre por unidad</h3>
<div class="tbl-wrap">
<table class="tbl">
<thead><tr>
<th>Placa</th><th>Cargas</th><th>Litros</th>
<th>Subtotal</th><th>IVA</th><th>Total</th><th>Verificación</th>
</tr></thead>
<tbody>
${placaRows.map(r=>{
  const diff=r.impCents-(r.subCents+r.ivaCents);
  const ok=diff===0;
  return`<tr>
<td><b>${esc(r.placa)}</b></td>
<td>${r.cargas}</td>
<td>${r.litros.toFixed(3)}</td>
<td>$${fmt(fromCents(r.subCents))}</td>
<td>$${fmt(fromCents(r.ivaCents))}</td>
<td><b>$${fmt(fromCents(r.impCents))}</b></td>
<td><span class="badge ${ok?'bg':'br'}">${ok?'✅ OK':'⚠️ '+fmt(fromCents(diff))}</span></td>
</tr>`;
}).join('')}
</tbody>
<tfoot style="background:#f8fafc;font-weight:700">
<tr>
<td><b>TOTAL</b></td>
<td>${mc.length}</td>
<td>${totalLit.toFixed(3)}</td>
<td>$${fmt(fromCents(totalSubCents))}</td>
<td>$${fmt(fromCents(totalIvaCents))}</td>
<td>$${fmt(fromCents(totalImpCents))}</td>
<td><span class="badge ${cuadraOk&&rowsOk?'bg':'br'}">${cuadraOk&&rowsOk?'✅ CUADRA':'⚠️ REVISA'}</span></td>
</tr>
</tfoot>
</table>
</div>`}
</div></div>`;
}

function pinModalPress(n){
  const m=S.modal;
  if(!m) return;
  if(m.paso===1){
    if(m.nuevo.length>=4) return;
    m.nuevo+=String(n);
    if(m.nuevo.length===4){ m.paso=2; }
  } else {
    if(m.confirma.length>=4) return;
    m.confirma+=String(n);
    if(m.confirma.length===4){
      if(m.nuevo===m.confirma){
        S.pin=m.nuevo;
        S.pinUnlocked=true;
        S.modal=null;
        saveState();
        render();
      } else {
        m._err='Los PINs no coinciden. Intenta de nuevo.';
        m.confirma=''; m.paso=1; m.nuevo='';
      }
    }
  }
  render();
}
function pinModalBack(){
  const m=S.modal;
  if(!m) return;
  if(m.paso===1) m.nuevo=m.nuevo.slice(0,-1);
  else m.confirma=m.confirma.slice(0,-1);
  render();
}

function renderPreciosPorDiaUI(G, flota){

  const dias = Object.keys(G.preciosDia).map(Number).sort((a,b)=>a-b);
  let rows = '';
  if(dias.length === 0){
    rows = `<p style="font-size:12px;color:#64748b;padding:8px 4px">Sin días agregados — se usará el precio base.</p>`;
  } else {
    rows = `<div style="display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto">` +
      dias.map(d => {
        const p = G.preciosDia[d];

          <button class="btn btn-r" style="padding:2px 6px;font-size:11px" onclick="delete _G('${flota}').preciosDia[${d}];rerender()">✕</button>
        </div>`;
      }).join('') + `</div>`;
  }
  return `
  <div style="font-size:11px;color:#64748b;margin:0 0 8px">

    <button class="btn btn-b" style="padding:6px 10px;font-size:12px;margin-bottom:1px" onclick="agregarPrecioDia('${flota}')">+ Día</button>
  </div>

  <div style="display:grid;grid-template-columns:60px 60px 1fr 1fr 1fr auto;gap:6px;margin-bottom:12px;align-items:end">
    <div class="fg"><label class="fl" style="font-size:10px">Desde</label>

function agregarPrecioDia(flota){
  const G = _G(flota);
  const d = parseInt(document.getElementById('pd-dia')?.value);
  const m = parseFloat(document.getElementById('pd-magna')?.value) || G.precioMagna;
  const di = parseFloat(document.getElementById('pd-diesel')?.value) || G.precioDiesel;
  const pr = parseFloat(document.getElementById('pd-premium')?.value) || G.precioPremium;
  const diasMes = new Date(G.anio, G.mes, 0).getDate();
  if(!d || d < 1 || d > diasMes){ alert(`Día inválido (1-${diasMes})`); return; }
  G.preciosDia[d] = { magna: m, diesel: di, premium: pr };
  rerender();
}

function aplicarRangoPrecios(flota){
  const G = _G(flota);
  const desde = parseInt(document.getElementById('pd-rdesde')?.value);
  const hasta = parseInt(document.getElementById('pd-rhasta')?.value);
  const m = parseFloat(document.getElementById('pd-rmagna')?.value) || G.precioMagna;
  const di = parseFloat(document.getElementById('pd-rdiesel')?.value) || G.precioDiesel;
  const pr = parseFloat(document.getElementById('pd-rpremium')?.value) || G.precioPremium;
  const diasMes = new Date(G.anio, G.mes, 0).getDate();
  if(!desde || !hasta || desde > hasta || desde < 1 || hasta > diasMes){

  for(let d = desde; d <= hasta; d++){
    G.preciosDia[d] = { magna: m, diesel: di, premium: pr };
  }
  rerender();
}

// Obtener el precio de un combustible para un día específico
// Si preciosPorDia=true y el día NO está en preciosDia → null (día eliminado = sin carga)
function getPrecioDia(G, dia, combustible){
  const c = (combustible||'Magna').toLowerCase();
  const key = c.includes('dies') ? 'diesel' : c.includes('prem') ? 'premium' : 'magna';
  if(G.preciosPorDia){
    if(!G.preciosDia[dia]) return null; // Día eliminado de la lista → no generar carga
    return G.preciosDia[dia][key] || G['precio'+key.charAt(0).toUpperCase()+key.slice(1)];
  }
  return G['precio'+key.charAt(0).toUpperCase()+key.slice(1)];
}

// ¿La unidad carga en este día de la semana?
function unidadCargaEnDia(u, fecha){
  const dc = (u.diasCarga || 'todos').toLowerCase().trim();
  if(dc === 'todos' || dc === '') return true;
  // Parsear fecha como local (no UTC) para evitar desfase de zona horaria
  const [y,mo,d] = fecha.split('-').map(Number);
  const dow = new Date(y, mo-1, d).getDay(); // 0=dom, 1=lun...6=sab
  const mapa = {0:'d',1:'l',2:'m',3:'x',4:'j',5:'v',6:'s',
                'dom':'d','lun':'l','mar':'m','mie':'x','mié':'x','jue':'j','vie':'v','sab':'s','sáb':'s'};
  const diasPermitidos = dc.split(/[,;\s]+/).map(s=>s.trim().slice(0,3)).map(s=>mapa[s]||s.charAt(0)).filter(Boolean);
  return diasPermitidos.includes(mapa[dow]);
}

function addExcepcion(flota){

}

function generarSabana(flota){
  flota = flota || 'SP';
  const G=_G(flota);
  const activas=S.unidades.filter(u=>u.estatus==='ACTIVA' && (u.flota||'SP')===flota);
  if(activas.length===0){
    G.error=`No hay unidades activas en la flota ${flota}. Importa o agrega unidades a esta flota.`;
    rerender(); return;
  }
  if(!G.precioMagna||G.precioMagna>50){G.error='Precio Magna inválido (máx $50).';rerender();return;}
  if(!G.precioDiesel||G.precioDiesel>50){G.error='Precio Diesel inválido (máx $50).';rerender();return;}
  G.error='';G.generando=true;rerender();

  setTimeout(()=>{
    try{
      const registros=_generarLogica(G,activas);
      G.resultado=registros;
      G.generando=false;
      const meses=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
      const entrada={
        id: Date.now(),
        fecha: new Date().toLocaleString('es-MX'),
        flota: flota,
        anio: G.anio, mes: G.mes,
        mesNom: meses[G.mes],
        presupuesto: G.presupuesto,
        precioMagna: G.precioMagna,
        precioDiesel: G.precioDiesel,
        totalRegistros: registros.length,
        totalImporte: registros.reduce((a,c)=>a+c.cargo,0),
        totalLitros: registros.reduce((a,c)=>a+c.litros,0),
      };
      S.historialSabanas.unshift(entrada);
      if(S.historialSabanas.length>50) S.historialSabanas=S.historialSabanas.slice(0,50);
      saveState();
      if(_uid()){
        db.from('sabanas').insert({
          user_id: _uid(),
          flota: flota,
          anio: G.anio,
          mes: G.mes,
          mes_nombre: meses[G.mes],
          presupuesto: G.presupuesto,
          precio_magna: G.precioMagna,
          precio_diesel: G.precioDiesel,
          total_registros: registros.length,
          total_importe: Math.round(registros.reduce((a,c)=>a+c.cargo,0)*100)/100,
          total_litros: Math.round(registros.reduce((a,c)=>a+c.litros,0)*100)/100,
          registros: registros,
          created_at: new Date().toISOString(),
        }).then(({error})=>{ if(error) console.warn('sabanas insert:', error.message); });
      }
      rerender();
    }catch(e){
      G.error='Error al generar: '+e.message;
      G.generando=false;
      rerender();
    }
  },100);
}

function copiarPreciosFlota(origen, destino){
  var src = _G(origen), dst = _G(destino);
  dst.preciosDia    = JSON.parse(JSON.stringify(src.preciosDia));
  dst.precioMagna   = src.precioMagna;
  dst.precioDiesel  = src.precioDiesel;
  dst.precioPremium = src.precioPremium;
  rerender();
}

// Selecciona N días distribuidos uniformemente del arreglo de días elegibles
function _selectDays(dias, n){
  if(!n || n <= 0) return [...dias];
  if(n >= dias.length) return [...dias];
  const out = [];
  for(let i = 0; i < n; i++){
    out.push(dias[Math.min(Math.round(i * dias.length / n), dias.length-1)]);
  }
  // Eliminar duplicados por si el redondeo los generó
  return [...new Set(out)];
}

function _generarLogica(G,activas){
  const diasMes=new Date(G.anio,G.mes,0).getDate();
  const registros=[];

  // Tracking de ID, odómetro y días de descanso por unidad
  const unitState={};
  activas.forEach(u=>{
    unitState[u.placa]={
      id:parseInt(u.idInicial)||52,
      odo:parseInt(u.odometroActual)||0,
      descansaHasta:0  // día hasta el que descansa (no carga)
    };
  });

  // ── GENERACIÓN: SP (proporcional al saldo) vs ADM/PC (monto mensual fijo) ──────
  const todasConMonto=activas.every(u=>(u.montoMensual||0)>0);

  if(todasConMonto){
    // ── ADM / PC: monto mensual por unidad, días de carga específicos ──────
    const totalSaldo=activas.reduce((a,u)=>a+(u.saldo||0),0);
    const sumaMonto =activas.reduce((a,u)=>a+(u.montoMensual||0),0);
    const factorAjuste=(G.presupuesto>0&&sumaMonto>0)?G.presupuesto/sumaMonto:1;

    const infoUnidades=activas.map(u=>{
      const dp=[];
      for(let d=1;d<=diasMes;d++){
        const f=`${G.anio}-${String(G.mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if(unidadCargaEnDia(u,f)&&(!G.preciosPorDia||G.preciosDia[d])) dp.push({d,fecha:f});
      }
      return{u,dias:dp};
    });

    const objetivos=infoUnidades.map(({u})=>{
      if((u.montoMensual||0)>0) return Math.round(u.montoMensual*factorAjuste*100)/100;
      const prop=totalSaldo>0?u.saldo/totalSaldo:1/activas.length;
      return Math.round(G.presupuesto*prop*100)/100;
    });
    if(factorAjuste!==1&&G.presupuesto>0){
      const sumaObj=Math.round(objetivos.reduce((a,c)=>a+c,0)*100)/100;
      const diff=Math.round((G.presupuesto-sumaObj)*100)/100;
      if(Math.abs(diff)>0.01&&Math.abs(diff)<2){
        for(let i=objetivos.length-1;i>=0;i--){
          if((activas[i].montoMensual||0)>0){objetivos[i]=Math.round((objetivos[i]+diff)*100)/100;break;}
        }
      }
    }

    const gas=S.gasolineras[0];
    infoUnidades.forEach(({u,dias},uIdx)=>{
      if(!dias.length) return;
      const objetivo=objetivos[uIdx];
      let numCargasUnit=0;
      if((u.numCargas||0)>0){
        numCargasUnit=u.numCargas;
      } else if((u.montoMensual||0)>0&&u.saldo>0){
        numCargasUnit=Math.max(1,Math.round(u.montoMensual/u.saldo));
      }
      const diasUsados=numCargasUnit>0?_selectDays(dias,numCargasUnit):dias;
      const n=diasUsados.length;
      const cargoBase=Math.max(1,Math.floor(objetivo/n));
      let acum=0;
      diasUsados.forEach(({d,fecha},i)=>{
        const precio=getPrecioDia(G,d,u.combustible);
        if(!precio) return;
        const esUltimo=i===n-1;
        let cargo;
        if(esUltimo){
          cargo=Math.round((objetivo-acum)*100)/100;
          if(cargo<=0) cargo=cargoBase;
        } else {
          cargo=cargoBase;
        }
        let litros=Math.floor(cargo/precio*10000)/10000;
        for(let t=0;t<20;t++){
          if(Math.round(litros*precio*100)/100===cargo) break;
          litros=Math.round((litros+0.0001)*10000)/10000;
        }
        const cargoFinal=Math.round(litros*precio*100)/100;
        const importeCents=Math.round(cargoFinal*100);
        const iva=Math.round(importeCents*16/116)/100;
        const sub=Math.round(importeCents-iva*100)/100;
        const hora=`${String(8+Math.floor(Math.random()*8)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`;
        registros.push({
          tarjeta:u.tarjeta,tipoTarjeta:'CH',placa:u.placa,
          fecha:`${fecha} ${hora}`,id:0,
          cargo:cargoFinal,abono:0,saldo:0,concepto:'Consumo',
          estacion:gas?.estacionId||'',nombre:gas?.nombre||'',
          domicilio:gas?.direccion||'',colonia:gas?.colonia||'',
          ciudad:gas?.ciudad||'',estado:gas?.estado||'',rfc:gas?.rfc||'',
          producto:u.combustible,precio,
          kmIni:0,kmFin:0,litros,rendimiento:'0.00',
          iva:'16%',consumo:'Normal',
          usuario:'MUNICIPIO DE '+(gas?.municipio||'').toUpperCase(),
          centroCosto:'SEGURIDAD PUBLICA',expediente:'0',tagFolio:'0',
          importe:cargoFinal,sub,ivaNum:iva,
          gasolineraId:gas?.id||1,combustible:u.combustible,
        });
        acum=Math.round((acum+cargoFinal)*100)/100;
      });
    });

  } else {
    // ── SP: una carga por día por unidad, montos variados, presupuesto exacto ──
    const totalSaldo=activas.reduce((a,u)=>a+(u.saldo||0),0);
    const gas=getGas(S.cap.municipio)||S.gasolineras[0];

    // 1. Días elegibles por unidad
    const diasPorUnidadSP=activas.map(u=>{
      const dp=[];
      for(let d=1;d<=diasMes;d++){
        const f=`${G.anio}-${String(G.mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if(unidadCargaEnDia(u,f)&&(!G.preciosPorDia||G.preciosDia[d])) dp.push({d,fecha:f});
      }
      return dp;
    });

    // 2. Capacidad máxima: saldo × días (máx una carga por día)
    const capacidades=activas.map((u,i)=>(u.saldo||0)*diasPorUnidadSP[i].length);

    // 3. Objetivos iniciales proporcionales al saldo
    const objetivos=activas.map(u=>
      totalSaldo>0?Math.round(G.presupuesto*(u.saldo||0)/totalSaldo*100)/100:0
    );

    // 4. Redistribuir exceso de unidades cuyo objetivo supera su capacidad
    for(let iter=0;iter<50;iter++){
      let excess=0, uncappedSaldo=0;
      objetivos.forEach((obj,i)=>{
        if(obj>capacidades[i]){excess=Math.round((excess+obj-capacidades[i])*100)/100;objetivos[i]=capacidades[i];}
        else{uncappedSaldo+=activas[i].saldo||0;}
      });
      if(excess<0.01||uncappedSaldo<=0) break;
      objetivos.forEach((obj,i)=>{
        if(obj<capacidades[i]){
          const add=Math.round(excess*(activas[i].saldo||0)/uncappedSaldo*100)/100;
          objetivos[i]=Math.min(capacidades[i],Math.round((obj+add)*100)/100);
        }
      });
    }

    // 5. Ajuste final de centavos (sum exacta)
    {
      const sumaObj=Math.round(objetivos.reduce((a,b)=>a+b,0)*100)/100;
      const diff=Math.round((G.presupuesto-sumaObj)*100)/100;
      if(Math.abs(diff)>=0.01){
        for(let i=objetivos.length-1;i>=0;i--){
          if(objetivos[i]>0){objetivos[i]=Math.round((objetivos[i]+diff)*100)/100;break;}
        }
      }
    }

    // 6. Generar tickets: una carga por día, montos aleatorios variados
    activas.forEach((u,uIdx)=>{
      const objetivo=objetivos[uIdx];
      if(objetivo<=0||!u.saldo) return;
      const diasEleg=diasPorUnidadSP[uIdx];
      if(!diasEleg.length) return;

      // Seleccionar días a usar
      let numCargasUnit=(u.numCargas||0)>0
        ?u.numCargas
        :(objetivo/diasEleg.length>=50?diasEleg.length:Math.max(1,Math.ceil(objetivo/50)));
      const diasUsados=_selectDays(diasEleg,numCargasUnit);
      const n=diasUsados.length;
      if(!n) return;

      // Plan de montos aleatorios garantizando min $50, max saldo, sum=objetivo
      const minCargo=Math.max(50,Math.floor(objetivo/n*0.35));
      const planSP=[];
      let remSP=objetivo;
      for(let pi=0;pi<n;pi++){
        if(pi===n-1){
          planSP.push(Math.max(0,Math.round(remSP*100)/100));
        } else {
          const left=n-pi;
          const maxThis=Math.min(u.saldo,remSP-minCargo*(left-1));
          if(maxThis<=minCargo){
            // No metas más de lo que queda dividido entre los días restantes (evita overshoot)
            planSP.push(Math.max(0,Math.min(minCargo,Math.round(remSP/left*100)/100)));
          } else {
            const center=remSP/left;
            const range=maxThis-minCargo;
            const variation=(Math.random()-0.5)*range*0.7;
            planSP.push(Math.round(Math.max(minCargo,Math.min(maxThis,center+variation))*100)/100);
          }
          remSP=Math.round((remSP-planSP[pi])*100)/100;
        }
      }

      let acum=0;
      diasUsados.forEach(({d,fecha},i)=>{
        const precio=getPrecioDia(G,d,u.combustible);
        if(!precio) return;
        const esUltimo=i===n-1;
        let cargo=esUltimo?Math.round((objetivo-acum)*100)/100:planSP[i];
        if(cargo<=0) return;
        // Solo los cargos intermedios respetan el tope; el último cierra el objetivo exacto
        if(!esUltimo) cargo=Math.min(cargo,u.saldo);
        let litros=Math.floor(cargo/precio*10000)/10000;
        for(let t=0;t<20;t++){if(Math.round(litros*precio*100)/100===cargo) break;litros=Math.round((litros+0.0001)*10000)/10000;}
        const cargoFinal=Math.round(litros*precio*100)/100;
        if(litros<=0||cargoFinal<=0) return;
        const importeCents=Math.round(cargoFinal*100);
        const iva=Math.round(importeCents*16/116)/100;
        const sub=Math.round(importeCents-iva*100)/100;
        const hMin=6*60+45,hMax=12*60+15;
        const minT=Math.floor(hMin+Math.random()*(hMax-hMin));
        const hh=String(Math.floor(minT/60)).padStart(2,'0');
        const mm=String(minT%60).padStart(2,'0');
        const ss=String(Math.floor(Math.random()*60)).padStart(2,'0');
        registros.push({
          tarjeta:u.tarjeta,tipoTarjeta:'CH',placa:u.placa,
          fecha:`${fecha} ${hh}:${mm}:${ss}`,id:0,
          cargo:cargoFinal,abono:0,
          saldo:Math.max(0,Math.round((u.saldo-cargoFinal)*100)/100),
          concepto:'Consumo',
          estacion:gas?.estacionId||'',nombre:gas?.nombre||'',
          domicilio:gas?.direccion||'',colonia:gas?.colonia||'',
          ciudad:gas?.ciudad||'',estado:gas?.estado||'',rfc:gas?.rfc||'',
          producto:u.combustible,precio,
          kmIni:0,kmFin:0,litros,rendimiento:'0.00',
          iva:'16%',consumo:'Normal',
          usuario:'MUNICIPIO DE '+(gas?.municipio||'').toUpperCase(),
          centroCosto:'SEGURIDAD PUBLICA',expediente:'0',tagFolio:'0',
          importe:cargoFinal,sub,ivaNum:iva,
          gasolineraId:gas?.id||1,combustible:u.combustible,
        });
        acum=Math.round((acum+cargoFinal)*100)/100;
      });
    });

    // 7. Ajuste de centavos por redondeo de litros (diferencia mínima)
    {
      const diffFinal=Math.round((G.presupuesto-registros.reduce((a,c)=>a+c.cargo,0))*100)/100;
      if(Math.abs(diffFinal)>=0.01&&Math.abs(diffFinal)<2){
        const lastByPlaca={};
        registros.forEach((r,i)=>{lastByPlaca[r.placa]=i;});
        for(const idx of Object.values(lastByPlaca).reverse()){
          const r=registros[idx];
          const u=activas.find(u=>u.placa===r.placa);
          const ncObj=Math.round((r.cargo+diffFinal)*100)/100;
          if(ncObj<=0||(u&&ncObj>u.saldo+0.01)) continue;
          let lit=Math.floor(ncObj/r.precio*10000)/10000;
          for(let t=0;t<20;t++){if(Math.round(lit*r.precio*100)/100===ncObj) break;lit=Math.round((lit+0.0001)*10000)/10000;}
          if(Math.round(lit*r.precio*100)/100===ncObj){
            r.litros=lit;r.cargo=ncObj;r.importe=ncObj;
            const c=Math.round(ncObj*100),iv=Math.round(c*16/116);
            r.ivaNum=iv/100;r.sub=(c-iv)/100;
            break;
          }
        }
      }
    }
  }

  // Ordenar por fecha
  registros.sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // ── REASIGNAR IDs Y ODÓMETROS en orden cronológico por unidad ─────────
  const idPorPlaca={};
  const odoPorPlaca={};
  activas.forEach(u=>{
    idPorPlaca[u.placa]=parseInt(u.idInicial)||52;
    odoPorPlaca[u.placa]=parseInt(u.odometroActual)||0;
  });
  registros.forEach(r=>{
    const u=activas.find(a=>a.placa===r.placa);
    if(idPorPlaca[r.placa]===undefined) idPorPlaca[r.placa]=52;
    r.id=idPorPlaca[r.placa];
    idPorPlaca[r.placa]+=2;
    if(u&&u.odometroActual>0&&(u.aumMinOdo||0)>0){
      const _fR=G.factorRendimiento??1;
      const rendBase=(u.aumMinOdo+Math.random()*(u.aumMaxOdo-u.aumMinOdo))*_fR;
      const rendNum=Math.floor(rendBase*100)/100;
      r.kmIni=odoPorPlaca[r.placa];
      r.kmFin=odoPorPlaca[r.placa]+Math.round(r.litros*rendNum);
      r.rendimiento=rendNum.toFixed(2);
      odoPorPlaca[r.placa]=r.kmFin;
    }
  });

  // ── REDONDEO A ENTERO PARA SP: cargo = número cerrado, último absorbe diferencia ──
  if(!todasConMonto){
    const byPlacaNorm={};
    registros.forEach((r,i)=>{ if(!byPlacaNorm[r.placa]) byPlacaNorm[r.placa]=[]; byPlacaNorm[r.placa].push(i); });
    Object.values(byPlacaNorm).forEach(idxs=>{
      if(idxs.length<2) return;
      // Guardar total original de la unidad (ya normalizado al presupuesto global)
      const totalOriginal=Math.round(idxs.reduce((a,i)=>a+registros[i].cargo,0)*100)/100;
      // Redondear todos los cargos excepto el último
      let acumRound=0;
      idxs.slice(0,-1).forEach(i=>{
        const r=registros[i];
        const precio=r.precio||G.precioMagna;
        const cargoRedondeado=Math.floor(r.cargo);
        if(cargoRedondeado<=0) return;
        let lit=Math.floor(cargoRedondeado/precio*10000)/10000;
        for(let t=0;t<20;t++){
          if(Math.round(lit*precio*100)/100===cargoRedondeado) break;
          lit=Math.round((lit+0.0001)*10000)/10000;
        }
        r.litros=lit; r.cargo=cargoRedondeado; r.importe=cargoRedondeado;
        const c=Math.round(cargoRedondeado*100),iv=Math.round(c*16/116);
        r.ivaNum=iv/100; r.sub=(c-iv)/100;
        acumRound=Math.round((acumRound+cargoRedondeado)*100)/100;
      });
      // Último ticket absorbe la diferencia para cerrar exactamente el total original
      const last=registros[idxs[idxs.length-1]];
      const precio=last.precio||G.precioMagna;
      const cargoLast=Math.round((totalOriginal-acumRound)*100)/100;
      if(cargoLast>0){
        let lit=Math.floor(cargoLast/precio*10000)/10000;
        for(let t=0;t<20;t++){
          if(Math.round(lit*precio*100)/100===cargoLast) break;
          lit=Math.round((lit+0.0001)*10000)/10000;
        }
        last.litros=lit; last.cargo=cargoLast; last.importe=cargoLast;
        const c=Math.round(cargoLast*100),iv=Math.round(c*16/116);
        last.ivaNum=iv/100; last.sub=(c-iv)/100;
      }
    });
  }

  // Guardar estado final con IDs ya correctos para el mes siguiente
  G._estadoFinal = {};
  Object.entries(unitState).forEach(([placa,st])=>{
    G._estadoFinal[placa] = {
      idSiguiente: idPorPlaca[placa]||st.id,
      odometroFinal: odoPorPlaca[placa]||st.odo
    };
  });

  return registros;
}

function exportarSabanaExcel(flota){
  const G=_G(flota||'SP');
  const r=G.resultado;
  if(!r||!r.length){alert('No hay sábana generada');return;}
  if(typeof ExcelJS==='undefined'){alert('ExcelJS no cargó. Verifica conexión a internet.');return;}

  const meses=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio',
    'Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const diasMes=new Date(G.anio,G.mes,0).getDate();
  const mesNom=meses[G.mes];
  const now=new Date();
  const nowStr=`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')} Hrs`;
  const gas=S.gasolineras[0];
  const muni=(gas?.municipio||'MUNICIPIO').toUpperCase();

  // ── Constantes de estilo ──────────────────────────────────────────────
  const FONT      = {name:'Arial', size:10};
  const FONT_BOLD = {name:'Arial', size:10, bold:true};
  const THIN      = {style:'thin'};
  const BORDER_ALL= {top:THIN,bottom:THIN,left:THIN,right:THIN};
  const BORDER_BOT= {bottom:THIN};
  const FMT_PESOS = '"$"#,##0.00';
  const FMT_NUM2  = '#,##0.00';

  // Por columna: [ancho, alineación, formatoNum]
  // alineación: 'center'|'left'|'right'
  const COLS = [
    [15.4,'center',null],    // A Tarjeta
    [13.6,'center',null],    // B Tipo Tarjeta
    [19.0,'center',null],    // C Placa
    [11.7,'center',null],    // D Fecha
    [8.0, 'center',null],    // E ID
    [11.0,'right', FMT_PESOS], // F Cargo
    [8.0, 'right', FMT_PESOS], // G Abono
    [22.6,'right', FMT_PESOS], // H Saldo
    [9.7, 'left',  null],    // I Concepto
    [22.6,'left',  null],    // J Estación
    [30.0,'left',  null],    // K Nombre
    [15.3,'left',  null],    // L Domicilio
    [11.7,'left',  null],    // M Colonia
    [8.0, 'left',  null],    // N Ciudad
    [17.1,'left',  null],    // O Estado
    [13.6,'center',null],    // P RFC
    [9.7, 'center',null],    // Q Producto
    [11.7,'right', FMT_PESOS], // R Precio
    [9.7, 'right', null],    // S Km INI
    [9.7, 'right', null],    // T Km FIN
    [13.6,'right', FMT_NUM2],  // U Litros
    [8.0, 'right', FMT_NUM2],  // V Rendimiento
    [11.7,'center',null],    // W IVA
    [22.6,'left',  null],    // X Consumo
    [28.0,'left',  null],    // Y Usuario
    [16.0,'left',  null],    // Z Centro Costo
    [9.7, 'left',  null],    // AA Expediente
    [8.0, 'left',  null],    // AB TagFolio
  ];
  const HEADERS=['Tarjeta','Tipo Tarjeta','Placa','Fecha','ID','Cargo','Abono','Saldo',
    'Concepto','Estación','Nombre','Domicilio','Colonia','Ciudad','Estado','RFC',
    'Producto','Precio','Km INI','Km FIN','Litros','Rendimiento','IVA','Consumo',
    'Usuario','Centro Costo','Expediente','TagFolio'];

  // ── Helpers ───────────────────────────────────────────────────────────
  function applyCell(cell, val, bold, halign, border, numFmt){
    cell.value = val;
    cell.font  = bold ? FONT_BOLD : FONT;
    cell.alignment = {horizontal:halign, vertical:'middle'};
    if(border) cell.border = border;
    if(numFmt) cell.numFmt = numFmt;
  }

  // ── Construir workbook ────────────────────────────────────────────────
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Sheet0');

  // Anchos de columna
  ws.columns = COLS.map(([w])=>({width:w}));

  // Helper para altura de fila (12.75pt)
  function addRow(values){
    const row = ws.addRow(values);
    row.height = 12.75;
    return row;
  }

  // Fila 1: timestamp en col G (7)
  const f1 = addRow([]);
  f1.getCell(7).value = nowStr;
  f1.getCell(7).font  = FONT;

  // Fila 2: Municipio en col C (3)
  const f2 = addRow([]);
  applyCell(f2.getCell(3), 'MUNICIPIO DE '+muni, true, 'left', null, null);

  // Fila 3: código en col C
  const f3 = addRow([]);
  applyCell(f3.getCell(3), '80857-102: SP', true, 'left', null, null);

  // Fila 4: vacía
  addRow([]);

  // Fila 5: Reporte en col C
  const f5 = addRow([]);
  const fechaIni=`${G.anio}-${String(G.mes).padStart(2,'0')}-01`;
  const fechaFin=`${G.anio}-${String(G.mes).padStart(2,'0')}-${String(diasMes).padStart(2,'0')}`;
  applyCell(f5.getCell(3), `Reporte de Consumos del ${fechaIni} al ${fechaFin}`, true, 'left', null, null);

  // Fila 6: vacía
  addRow([]);

  // Fila 7: Headers — negrita, centrado, borde completo
  const f7 = addRow(HEADERS);
  f7.height = 12.75;
  HEADERS.forEach((_,i)=>{
    const cell = f7.getCell(i+1);
    cell.font      = FONT_BOLD;
    cell.alignment = {horizontal:'center', vertical:'middle'};
    cell.border    = BORDER_ALL;
  });

  // ── Datos por bloques ─────────────────────────────────────────────────
  const ordenUnidades = S.unidades.map(u=>u.tarjeta);
  const porTarjeta = {};
  r.forEach(c=>{ if(!porTarjeta[c.tarjeta]) porTarjeta[c.tarjeta]=[]; porTarjeta[c.tarjeta].push(c); });
  Object.values(porTarjeta).forEach(arr=>arr.sort((a,b)=>a.fecha.localeCompare(b.fecha)));
  const tarjetasOrdenadas = ordenUnidades.filter(t=>porTarjeta[t]);
  Object.keys(porTarjeta).forEach(t=>{ if(!tarjetasOrdenadas.includes(t)) tarjetasOrdenadas.push(t); });

  tarjetasOrdenadas.forEach((tarjeta,blkIdx)=>{
    const bloque = porTarjeta[tarjeta];
    if(!bloque||!bloque.length) return;

    bloque.forEach(c=>{
      const vals=[
        c.tarjeta, c.tipoTarjeta, String(c.placa), c.fecha, c.id,
        c.cargo, c.abono, c.saldo, c.concepto, c.estacion,
        c.nombre, c.domicilio, c.colonia, c.ciudad, c.estado,
        c.rfc, c.producto, c.precio, c.kmIni, c.kmFin,
        parseFloat(c.litros)||0, parseFloat(c.rendimiento)||0,
        c.iva, c.consumo, c.usuario, c.centroCosto, c.expediente, c.tagFolio
      ];
      const row = addRow(vals);
      COLS.forEach(([,halign,numFmt],ci)=>{
        const cell = row.getCell(ci+1);
        cell.font      = FONT;
        cell.alignment = {horizontal:halign, vertical:'middle'};
        cell.border    = BORDER_BOT;
        if(numFmt) cell.numFmt = numFmt;
      });
    });

    // Fila vacía entre bloques
    if(blkIdx < tarjetasOrdenadas.length-1){
      const empty = addRow(new Array(28).fill(''));
      COLS.forEach((_,ci)=>{ empty.getCell(ci+1).font=FONT; });
    }
  });

  // ── Hoja Reporte por Tarjeta ──────────────────────────────────────────
  const ws2 = wb.addWorksheet('Reporte por Tarjeta');
  const hdrs2=['index','Tarjeta','Gasto Total Mes','Fecha (Menor Gasto)','Cargo (Menor Gasto)',
    'Saldo (Menor Gasto)','Fecha (Mayor Gasto)','Cargo (Mayor Gasto)','Saldo (Mayor Gasto)'];
  const h2row = ws2.addRow(hdrs2);
  hdrs2.forEach((_,i)=>{
    h2row.getCell(i+1).font=FONT_BOLD;
    h2row.getCell(i+1).border=BORDER_ALL;
    h2row.getCell(i+1).alignment={horizontal:'center'};
  });
  Object.values(porTarjeta).forEach((regs,idx)=>{
    const total=regs.reduce((a,c)=>a+c.cargo,0);
    const mn=regs.reduce((a,b)=>a.cargo<b.cargo?a:b);
    const mx=regs.reduce((a,b)=>a.cargo>b.cargo?a:b);
    const row=ws2.addRow([idx,regs[0].tarjeta,Math.round(total*100)/100,
      mn.fecha,mn.cargo,mn.saldo,mx.fecha,mx.cargo,mx.saldo]);
    row.eachCell(c=>c.font=FONT);
  });

  // ── Hoja Reporte Diario ───────────────────────────────────────────────
  const ws3 = wb.addWorksheet('Reporte Diario');
  const totalMes=r.reduce((a,c)=>a+c.cargo,0);
  const r3a=ws3.addRow(['Gasto Total del Mes:',Math.round(totalMes*100)/100]);
  r3a.getCell(1).font=FONT_BOLD; r3a.getCell(2).font=FONT;
  ws3.addRow([]);
  const r3h=ws3.addRow(['Dia','Gasto Total','Numero de Cargas']);
  r3h.eachCell(c=>{c.font=FONT_BOLD;c.border=BORDER_ALL;c.alignment={horizontal:'center'};});
  const byDia={};
  r.forEach(c=>{const d=parseInt(c.fecha.split('-')[2]);if(!byDia[d])byDia[d]={g:0,n:0};byDia[d].g+=c.cargo;byDia[d].n++;});
  for(let d=1;d<=diasMes;d++){
    const info=byDia[d]||{g:0,n:0};
    const row=ws3.addRow([d,Math.round(info.g*100)/100,info.n]);
    row.eachCell(c=>c.font=FONT);
  }

  // ── Descargar ─────────────────────────────────────────────────────────
  const filename=`SABANA_CONSUMO_${muni.replace(/ /g,'_')}_${G.anio}_${String(G.mes).padStart(2,'0')}_${mesNom.toUpperCase()}.xlsx`;
  wb.xlsx.writeBuffer().then(buffer=>{
    const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename; a.click();
    URL.revokeObjectURL(url);
  }).catch(err=>{
    alert('Error generando Excel: '+err.message);
    console.error(err);
  });
}

function cargarExcelImpresion(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      // Find header row (contains 'Tarjeta')
      let headerRow=-1;
      for(let i=0;i<Math.min(15,raw.length);i++){
        if(raw[i].some(v=>String(v).trim()==='Tarjeta')){headerRow=i;break;}
      }
      if(headerRow<0){alert('No se encontró fila de encabezados. Asegúrate que la primera fila tenga "Tarjeta".');return;}
      const headers=raw[headerRow].map(h=>String(h).trim());
      const registros=[];
      for(let i=headerRow+1;i<raw.length;i++){
        const row=raw[i];
        if(!row[0]) continue;
        const obj={};
        headers.forEach((h,ci)=>obj[h]=row[ci]);
        // Normalizar campos
        registros.push({
          tarjeta:String(obj['Tarjeta']||''),
          tipoTarjeta:obj['Tipo Tarjeta']||'CH',
          placa:String(obj['Placa']||''),
          fecha:String(obj['Fecha']||''),
          id:parseInt(obj['ID'])||0,
          idConsumo:parseInt(obj['ID'])||0,
          cargo:parseFloat(obj['Cargo'])||0,
          importe:parseFloat(obj['Cargo'])||0,
          abono:parseFloat(obj['Abono'])||0,
          saldo:parseFloat(obj['Saldo'])||0,
          saldoTarjeta:parseFloat(obj['Saldo'])||0,
          concepto:obj['Concepto']||'Consumo',
          estacion:String(obj['Estación']||obj['Estacion']||''),
          nombre:obj['Nombre']||'',
          producto:obj['Producto']||'Magna',
          combustible:obj['Producto']||'Magna',
          precio:parseFloat(obj['Precio'])||0,
          kmIni:parseInt(obj['Km INI'])||0,
          kmFin:parseInt(obj['Km FIN'])||0,
          litros:parseFloat(obj['Litros'])||0,
          rendimiento:String(obj['Rendimiento']||'0.00'),
          iva:obj['IVA']||'16%',
          ivaNum:parseFloat(obj['Cargo']||0)*0.16/1.16,
          sub:parseFloat(obj['Cargo']||0)*(1-0.16/1.16),
          numUnico:String(parseInt(obj['ID'])||0),
          gasolineraId:1,
          hora:(String(obj['Fecha']||'').split(' ')[1]||'08:00:00').slice(0,8),
          formaPago:'EFECTIVO',
          notaNum:getNextNota(),
          folio:getNextFolio(),
          webId:String(getNextWebId()),
          posicion:'4',
          terminal:S.cfgConsumo.terminal||'4',
        });
      }
      S.impresion.registros=registros;
      S.impresion.selIdx=0;
      rerender();
    }catch(err){alert('Error al leer el archivo: '+err.message);}
  };
  reader.readAsBinaryString(file);
}

function imprimirRegistro(){
  const IMP=S.impresion;
  if(IMP.selIdx<0||!IMP.registros.length) return;
  const c=IMP.registros[IMP.selIdx];
  // Construir objeto compatible con tktBomba/tktConsumo
  const tkt={
    ...c,
    id:c.id||c.idConsumo,
    importe:c.cargo||c.importe,
    hora:c.hora||(c.fecha||'').split(' ')[1]||'08:00:00',
    folio:c.folio||getNextFolio(),
    notaNum:c.notaNum||getNextNota(),
    webId:c.webId||String(getNextWebId()),
    numUnico:c.numUnico||String(c.id||c.idConsumo||''),
    formaPago:c.formaPago||'EFECTIVO',
    posicion:c.posicion||'4',
    terminal:c.terminal||S.cfgConsumo.terminal||'4',
  };
  const gas=S.gasolineras.find(g=>g.estacionId===c.estacion)||S.gasolineras[0];
  if(IMP.printBomba&&IMP.printConsumo){
    openPrintWin(tktBomba(tkt,gas),S.posBomba);
    setTimeout(()=>openPrintWin(tktConsumo(tkt,gas),S.posConsumo),400);
  } else if(IMP.printBomba){
    openPrintWin(tktBomba(tkt,gas),S.posBomba);
  } else if(IMP.printConsumo){
    openPrintWin(tktConsumo(tkt,gas),S.posConsumo);
  }
  // Avanzar al siguiente
  if(IMP.selIdx<IMP.registros.length-1){
    S.impresion.selIdx++;
    rerender();
  }
}

function imprimirTodos(){
  if(!confirm(`¿Imprimir todos los ${S.impresion.registros.length} registros? Se abrirán ventanas para cada uno.`)) return;
  S.impresion.selIdx=0;
  let i=0;
  const next=()=>{
    if(i>=S.impresion.registros.length) return;
    S.impresion.selIdx=i;
    imprimirRegistro();
    i++;
    setTimeout(next,1500);
  };
  next();
}

function guardarNuevaUnidad(){
  const D=S._unitDraft||{};
  const E={};
  if(!String(D.placa||'').trim()) E.placa='La placa es obligatoria';
  else if(S.unidades.find(u=>u.placa===String(D.placa).trim())) E.placa='Ya existe esta placa';
  if(!String(D.tarjeta||'').trim()) E.tarjeta='La tarjeta es obligatoria';
  if(!parseFloat(D.tanque)||parseFloat(D.tanque)<=0) E.tanque='Ingresa la capacidad del tanque';
  if(!parseFloat(D.saldo)||parseFloat(D.saldo)<=0) E.saldo='Ingresa el saldo diario';
  if(!parseFloat(D.idInicial)||parseFloat(D.idInicial)<=0) E.idInicial='Ingresa el ID inicial';
  if(parseFloat(D.aumMinOdo)>0&&parseFloat(D.aumMaxOdo)>0&&parseFloat(D.aumMinOdo)>=parseFloat(D.aumMaxOdo))
    E.aumMaxOdo='Debe ser mayor que el mínimo';
  S._unitErrors=E;
  if(Object.keys(E).length){rerender();return;}

  const nueva={
    placa:String(D.placa).trim(),
    tarjeta:String(D.tarjeta).trim(),
    estatus:D.estatus||'ACTIVA',
    combustible:D.combustible||'Magna',
    tanque:parseFloat(D.tanque)||0,
    saldo:parseFloat(D.saldo)||0,
    tipoCarga:D.tipoCarga||'OPCIONAL',
    idInicial:parseInt(D.idInicial)||52,
    odometroActual:parseInt(D.odometroActual)||0,
    aumMinOdo:parseFloat(D.aumMinOdo)||0,
    aumMaxOdo:parseFloat(D.aumMaxOdo)||0,
    observaciones:D.observaciones||'',
    tipoVehiculo:D.tipoVehiculo||'CAMIONETA',
    vehiculo:(D.vehiculo||'').toUpperCase().trim(),
    marca:(D.marca||'').toUpperCase().trim(),
    modelo:parseInt(D.modelo)||'',
  };
  S.unidades.push(nueva);
  saveState();
  S._unitSuccess=nueva.placa;
  S._unitDraft=null;
  S._unitErrors={};
  rerender();
}

function eliminarUnidad(placa){
  if(!confirm(`¿Eliminar la unidad con placa ${placa}? Esta acción no se puede deshacer.`)) return;
  S.unidades=S.unidades.filter(u=>u.placa!==placa);
  saveState();
  rerender();
}


async function actualizarPlantilla(flota){
  const G=_G(flota||'SP');
  const estado=G._estadoFinal;
  if(!estado||!Object.keys(estado).length){ alert('No hay datos de estado final. Genera una sábana primero.'); return; }
  const total=Object.keys(estado).length;
  if(!confirm(`¿Actualizar la plantilla de ${total} unidades?\n\n• ID Inicial = último ID + 2\n• Odómetro Actual = último KM FIN`)) return;

  let actualizadas=0;
  const updates=[];
  S.unidades.forEach((u,idx)=>{
    const st=estado[u.placa];
    if(!st) return;
    const cambios={idInicial: st.idSiguiente};
    S.unidades[idx].idInicial=st.idSiguiente;
    if(u.odometroActual>0&&st.odometroFinal>0){
      S.unidades[idx].odometroActual=st.odometroFinal;
      cambios.odometroActual=st.odometroFinal;
    }
    updates.push({placa:u.placa, cambios});
    actualizadas++;
  });
  saveState();
  render();
  alert(`✅ ${actualizadas} unidades actualizadas.`);
  // Sync Supabase en background
  for(const {placa,cambios} of updates){
    actualizarUnidad(placa, cambios).catch(e=>console.error('plantilla:', placa, e.message));
  }
}

function pinPress(n){
  if(S.pinInput.length>=4) return;
  S.pinInput+=String(n);
  if(S.pinInput.length===4){
    if(S.pinInput===S.pin){
      S.pinUnlocked=true;
      S.pinInput='';
      S._pinError='';
      render();
    } else {
      S._pinError='PIN incorrecto';
      setTimeout(()=>{S.pinInput='';S._pinError='';render();},1000);
      render();
    }
  } else { render(); }
}

function pinBackspace(){
  S.pinInput=S.pinInput.slice(0,-1);
  render();
}

    gen:    _serGen(S.gen),
    genADM: _serGen(S.genADM),

  };
  const blob=new Blob([JSON.stringify(datos,null,2)],{type:'application/json'});

}

function restaurarRespaldo(input){
  const file=input.files[0];
  if(!file) return;
  if(!confirm('¿Restaurar desde este archivo? Se reemplazarán TODOS los datos actuales.')) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.version||!d.version.startsWith('FleetControlSP')){
        alert('Archivo no válido. Asegúrate de usar un respaldo generado por FleetControl SP.');
        return;
      }
      if(d.gasolineras) S.gasolineras=d.gasolineras;
      if(d.unidades) S.unidades=d.unidades;
      if(d.consumos) S.consumos=d.consumos;
      if(d.historialSabanas) S.historialSabanas=d.historialSabanas;
      if(d.presupuestoMensual) S.presupuestoMensual=d.presupuestoMensual;
      if(d.posBomba) S.posBomba=d.posBomba;
      if(d.posConsumo) S.posConsumo=d.posConsumo;
      if(d.cfgConsumo) S.cfgConsumo={...S.cfgConsumo,...d.cfgConsumo};
      if(d.cfgBomba) S.cfgBomba={...S.cfgBomba,...d.cfgBomba};
      if(d.tktFields) S.tktFields=d.tktFields;
      if(d.pin!=null) S.pin=d.pin;
      _loadGen(S.gen,    d.gen);
      _loadGen(S.genADM, d.genADM);
      _loadGen(S.genPC,  d.genPC);
      saveState();
      alert(`✅ Respaldo restaurado correctamente.\n${d.unidades?.length||0} unidades, ${d.consumos?.length||0} consumos.\n\nSincronizando con Supabase...`);
      render();
      // Sincronizar todo a Supabase
      _sincronizarTodo().then(()=>{ render(); console.log('✅ Supabase sincronizado'); });
    }catch(err){
      alert('Error al leer el archivo: '+err.message);
    }
  };
  reader.readAsText(file);
}

function exportarPlantillaUnidades(){
  if(!window.XLSX){alert('Cargando librería, espera un momento...');return;}
  // Respetar el filtro de flota activo
  const flotaFiltro = S._filtroFlota || '';
  const unidades = flotaFiltro
    ? S.unidades.filter(u=>(u.flota||'SP')===flotaFiltro)
    : S.unidades;
  const flotaNombre = flotaFiltro || 'TODAS';
  const wb=XLSX.utils.book_new();
  const headers=['PLACA','TARJETA','ESTATUS','COMBUSTIBLE','TANQUE','SALDO','TIPO CARGA','ID INICIAL','ODOMETRO ACTUAL','AUM MIN ODO','AUM MAX ODO','OBSERVACIONES','TIPO VEHICULO','VEHICULO','MARCA','MODELO','FLOTA','DIAS CARGA','MONTO MENSUAL','CARGAS'];
  const rows=unidades.map(u=>[
    u.placa,u.tarjeta,u.estatus,u.combustible,u.tanque,u.saldo,
    u.tipoCarga,u.idInicial,u.odometroActual,u.aumMinOdo,u.aumMaxOdo,
    u.observaciones||'',u.tipoVehiculo,u.vehiculo||'',u.marca||'',u.modelo||'',
    u.flota||'SP', u.diasCarga||'todos', u.montoMensual||0, u.numCargas||0
  ]);
  const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
  ws['!cols']=headers.map(()=>({wch:16}));
  // Header bold
  headers.forEach((_,ci)=>{
    const addr=XLSX.utils.encode_cell({r:0,c:ci});
    if(ws[addr]){ws[addr].s={font:{bold:true}};}
  });
  XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
  XLSX.writeFile(wb,`UNIDADES_${flotaNombre}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function toggleSelectUnit(placa){

  const idx=S.selectedUnits.indexOf(placa);

  else S.selectedUnits.push(placa);
  rerender();
}

function selectAllUnits(filtered){
  // Si se llama sin argumento o filtered está vacío, usar todas las unidades filtradas actuales
  if(!filtered || !filtered.length){
    const q=(S.search||'').toLowerCase();
    filtered=S.unidades.filter(u=>{
      const matchQ=!q||u.placa.toLowerCase().includes(q)||(u.vehiculo||'').toLowerCase().includes(q)||(u.tarjeta||'').includes(q);
      const matchTipo=!S._filtroTipo||u.tipoVehiculo===S._filtroTipo;
      const matchCarga=!S._filtroTipoCarga||u.tipoCarga===S._filtroTipoCarga;
      const matchFlota=!S._filtroFlota||(u.flota||'SP')===S._filtroFlota;
      return matchQ&&matchTipo&&matchCarga&&matchFlota;
    });
  }
  // Toggle: si ya están todos seleccionados, deseleccionar
  const placas=filtered.map(u=>u.placa);
  const todosSeleccionados=placas.every(p=>(S.selectedUnits||[]).includes(p));
  S.selectedUnits = todosSeleccionados ? [] : placas;
  rerender();
}

async function aplicarEdicionMasiva(){
  const sel=S.selectedUnits||[];
  const m=S._massEdit||{};
  if(!sel.length){alert('No hay unidades seleccionadas.');return;}
  const cambios=Object.fromEntries(Object.entries(m).filter(([,v])=>v!==null&&v!==''&&v!==undefined));
  if(!Object.keys(cambios).length){alert('No hay cambios para aplicar.');return;}
  const desc=Object.entries(cambios).map(([k,v])=>`${k}: ${v}`).join(', ');
  if(!confirm(`¿Aplicar estos cambios a ${sel.length} unidades?\n\n${desc}`)) return;
  // Actualizar UI inmediatamente
  sel.forEach(placa=>{
    const idx=S.unidades.findIndex(u=>u.placa===placa);
    if(idx<0) return;
    Object.entries(cambios).forEach(([k,v])=>{ S.unidades[idx][k]=v; });
  });
  S.selectedUnits=[]; S._massEdit={};
  rerender();
  // Sync Supabase en background
  for(const placa of sel){
    actualizarUnidad(placa, cambios).catch(e=>console.error('masiva:', placa, e.message));
  }
}

function _generarCodigo(){
  return String(Math.floor(100000+Math.random()*900000));
}

function enviarCodigoRecuperacion(){
  const usuario=S.recuperacion.usuario||(document.getElementById('rec-user')?.value||'');
  if(!usuario.trim()){S.recuperacion.error='Ingresa tu nombre de usuario.';render();return;}
  const u=S.usuarios.find(x=>x.usuario===usuario.trim());
  if(!u){S.recuperacion.error='Usuario no encontrado.';render();return;}

  const codigo=_generarCodigo();
  S.recuperacion._codigo=codigo;
  S.recuperacion._usuarioId=u.id;
  S.recuperacion.usuario=usuario.trim();

  // Intentar enviar por EmailJS si está configurado
  const adminEmail=S.adminEmail||(S.usuarios.find(x=>x.rol==='superadmin')?.email||'');
  if(S.emailjsKey&&S.emailjsService&&S.emailjsTemplate&&adminEmail){
    if(typeof emailjs!=='undefined'){
      emailjs.init({publicKey:S.emailjsKey});
      emailjs.send(S.emailjsService, S.emailjsTemplate, {
        to_email: adminEmail,
        usuario: u.usuario,
        nombre: u.nombre||u.usuario,
        codigo: codigo,
        fecha: new Date().toLocaleString('es-MX'),
      }).then(()=>{
        console.log('Email enviado OK');
      }).catch(err=>{
        console.warn('EmailJS error:',err);
      });
    }
  }

  // Mostrar código al administrador también en pantalla (fallback si no hay email)
  if(!adminEmail||!S.emailjsKey){
    alert(`⚠️ EmailJS no configurado.\n\nCódigo temporal para ${u.usuario}:\n\n${codigo}\n\nAnótalo y dáselo al usuario.`);
  }

  S.recuperacion.paso=2;
  S.recuperacion.error='';
  render();
}

function verificarCodigo(){
  const codigo=S.recuperacion.codigo||(document.getElementById('rec-code')?.value||'');
  if(codigo.trim()===S.recuperacion._codigo){
    S.recuperacion.paso=3;
    S.recuperacion.error='';
  } else {
    S.recuperacion.error='Código incorrecto. Verifica con el administrador.';
  }
  render();
}

function cambiarPassword(){
  const nueva=document.getElementById('rec-new')?.value||'';
  const confirma=document.getElementById('rec-confirm')?.value||'';
  if(nueva.length<6){S.recuperacion.error='Mínimo 6 caracteres.';render();return;}
  if(nueva!==confirma){S.recuperacion.error='Las contraseñas no coinciden.';render();return;}
  const idx=S.usuarios.findIndex(x=>x.id===S.recuperacion._usuarioId);
  if(idx>=0){
    S.usuarios[idx].password=nueva;
    saveState();
    alert('✅ Contraseña actualizada. Ya puedes iniciar sesión.');
    S.recuperacion={activo:false,usuario:'',paso:1,codigo:'',error:''};
    render();
  }
}
